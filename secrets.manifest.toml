# Pipeline secrets and variables for every cheunjm repo (INF-1983, D14).
#
# Names and 1Password references only: never values. scripts/sync-secrets.py
# reads each `ref` with `op read` and sets it on the listed repos through stdin.
# App runtime env stays in Doppler; only the Doppler service tokens live here.
#
#   [repos.<name>]      every repo the tooling manages
#     ruleset           apply the default-branch ruleset (scripts/apply-rulesets.py)
#     extra_checks      required checks beyond `ci / gate` and `changeset / check`
#
#   [[secret]]
#     name              GitHub secret or variable name
#     ref               op://Openclaw/<item>/<field>
#     repos             list of repo names, or "all"
#     env               optional GitHub Environment (develop or master)
#     kind              "secret" (default) or "variable"
#
# Entries marked `confirm` map to an existing 1Password item that is believed,
# not verified, to hold the same value GitHub has today. Items marked
# `create` do not exist in 1Password yet. GitHub cannot return a secret's
# value, so Jace fills those in before the first real sync.

[repos.".github"]
ruleset = true

[repos.arami]
ruleset = false

[repos.claude-statusline]
ruleset = false

[repos.clipsync]
ruleset = false

[repos.conventions]
ruleset = false

[repos.dotclaw]
ruleset = false

[repos.engineering-log]
ruleset = false

[repos.maps-organizer]
ruleset = false

[repos.mem0]
ruleset = false

[repos.portfolio]
ruleset = false

[repos.star-organizer]
ruleset = false

[repos.starlog]
ruleset = false

[repos.ui]
ruleset = false
extra_checks = ["e2e / web", "ci / api", "ci / stories"]

# --- Every repo ---------------------------------------------------------------

[[secret]]
name = "BOT_APP_ID"
ref = "op://Openclaw/github.app-key.cheunjm-openclaw-bot/app_id"
repos = "all"

[[secret]]
name = "BOT_PRIVATE_KEY"
ref = "op://Openclaw/github.app-key.cheunjm-openclaw-bot/private_key"
repos = "all"

[[secret]]
# confirm: notify-merge's bot token
name = "SLACK_BOT_TOKEN"
ref = "op://Openclaw/slack.bot-token.openclaw/bot_token"
repos = ["arami", "claude-statusline", "clipsync", "conventions", "dotclaw", "engineering-log", "maps-organizer", "mem0", "portfolio", "star-organizer", "starlog", "ui"]

[[secret]]
# openwiki's key for the Studio LiteLLM instance (D28)
name = "LITELLM_API_KEY"
ref = "op://Openclaw/litellm.openwiki-key/credential"
repos = ["arami", "claude-statusline", "clipsync", "conventions", "dotclaw", "engineering-log", "maps-organizer", "mem0", "portfolio", "star-organizer", "starlog", "ui"]

