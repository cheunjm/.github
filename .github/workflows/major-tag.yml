name: Major tag

# Moves the floating major tag (v1, v2, ...) to each new stable release tag, so
# callers pinned to `@v1` pick up a release when its Version PR merges (D4).
# Release tags are created by release.yml (`changeset git-tag`) with the
# arami-bot token, which is what lets this workflow run. Prereleases are ignored.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to point its major tag at (e.g. v1.0.0)"
        required: true

permissions: {}

concurrency:
  group: major-tag
  cancel-in-progress: false

jobs:
  move:
    name: release / major-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - name: Point the major tag at this release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a stable release tag; nothing to do"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          # The commit the release tag points at (annotated tags are dereferenced).
          SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          # git/ref/ (singular) matches exactly; git/refs/ falls back to a prefix
          # match, so it would "find" v1.0.0 when v1 does not exist yet.
          if gh api "repos/$REPO/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPO/git/refs/tags/$major" -f sha="$SHA" -F force=true >/dev/null
            echo "Moved $major to $TAG ($SHA)"
          else
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$major" -f sha="$SHA" >/dev/null
            echo "Created $major at $TAG ($SHA)"
          fi
