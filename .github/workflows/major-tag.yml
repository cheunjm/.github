name: Major tag

# Moves the floating major tag (v1, v2, ...) to each new stable release tag, so
# callers pinned to `@v1` pick up a release when its Version PR merges (D4).
# Release tags are created by release.yml (`changeset git-tag`) with the
# arami-bot token, which is what lets this workflow run. Prereleases are ignored.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable release tag to point its major tag at (e.g. v1.0.0)"
        required: true

permissions: {}

concurrency:
  group: major-tag
  cancel-in-progress: false

jobs:
  move:
    name: release / major-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Point the major tag at this release
        # A git push, not the refs API: the App may push tags with git (as
        # changesets does for the release tag), but the API answers 403 when the
        # commit carries workflow files.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is not a stable release tag; nothing to do"
            exit 0
          fi
          major="v${BASH_REMATCH[1]}"
          # The commit the release tag points at (annotated tags are dereferenced).
          SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          git tag -f "$major" "$SHA"
          git push --force origin "refs/tags/$major"
          echo "Pointed $major at $TAG ($SHA)"
