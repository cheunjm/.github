name: Changeset version

# Keeps one "Version Packages" PR open per repo (updated in place on every
# push to the default branch) and optionally publishes. Opened with the
# arami-bot app token so the PR triggers CI.
#
# The changesets tooling is pinned here and installed ephemerally
# (--no-save) so repos do not carry @changesets/* dependencies. Changesets
# resolves the changelog plugin from the repo, so it cannot come from npx.
#
# Caller:
#
#   name: Release
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
#   concurrency:
#     group: release
#     cancel-in-progress: false
#   jobs:
#     version:
#       uses: cheunjm/.github/.github/workflows/changeset-version.yml@main
#       permissions:
#         contents: write
#         pull-requests: write
#       secrets: inherit

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Empty uses the calling repo's CI_RUNNER variable (e.g. mac-studio), then ubuntu-latest."
        required: false
        type: string
        default: ""
      node-version:
        required: false
        type: string
        default: "20"
      install-command:
        description: "Project install step run before the tooling install (e.g. 'npm ci --legacy-peer-deps'). Empty skips it."
        required: false
        type: string
        default: ""
      registry-url:
        description: "npm registry for setup-node (e.g. https://npm.pkg.github.com). Empty uses the default."
        required: false
        type: string
        default: ""
      scope:
        description: "npm scope for setup-node (e.g. @aramiworks)"
        required: false
        type: string
        default: ""
      publish:
        description: "Publish command (e.g. 'npx changeset publish'). Empty opens/updates the version PR only."
        required: false
        type: string
        default: ""
      title:
        required: false
        type: string
        default: "chore: version packages"
      create-github-releases:
        required: false
        type: boolean
        default: true
      install-tooling:
        description: "Install the pinned changesets tooling ephemerally. Set false for repos that already declare @changesets/cli and @changesets/changelog-github and install them via install-command (monorepos, private registries)."
        required: false
        type: boolean
        default: true
      changesets-version:
        description: "Pinned @changesets/cli version"
        required: false
        type: string
        default: "2.30.0"
      changelog-github-version:
        description: "Pinned @changesets/changelog-github version"
        required: false
        type: string
        default: "0.6.0"
    secrets:
      BOT_APP_ID:
        required: true
      BOT_PRIVATE_KEY:
        required: true
      PKG_READ_TOKEN:
        description: "Token used as NODE_AUTH_TOKEN for the install step (private packages)"
        required: false

jobs:
  version:
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          scope: ${{ inputs.scope }}

      - name: Install project dependencies
        if: ${{ inputs.install-command != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: bash -c "$INSTALL_COMMAND"

      - name: Keep installed tooling out of the version commit
        run: |
          # changesets/action commits with `git add .`. Without this, repos
          # whose .gitignore lacks node_modules would commit the ephemeral
          # install into the Version Packages PR.
          mkdir -p .git/info
          printf 'node_modules/\n' >> .git/info/exclude

      - name: Install changesets tooling (ephemeral)
        if: ${{ inputs.install-tooling }}
        env:
          CLI_VERSION: ${{ inputs.changesets-version }}
          CHANGELOG_VERSION: ${{ inputs.changelog-github-version }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            "@changesets/cli@$CLI_VERSION" "@changesets/changelog-github@$CHANGELOG_VERSION"

      - name: Version PR / publish
        # Pinned to a commit: this third-party action receives the arami-bot token.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # v2 needs the custom token passed explicitly; checkout credentials and the
          # GITHUB_TOKEN env below no longer count. push-with-git-cli keeps the v1
          # behaviour (git add . plus a git push) instead of the v2 default of
          # committing through the GitHub API.
          github-token: ${{ steps.app-token.outputs.token }}
          push-with-git-cli: true
          version-script: npx changeset version
          publish-script: ${{ inputs.publish }}
          pr-title: ${{ inputs.title }}
          commit-message: ${{ inputs.title }}
          create-github-releases: ${{ inputs.create-github-releases }}
        env:
          # changelog-github reads this while `changeset version` runs.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
