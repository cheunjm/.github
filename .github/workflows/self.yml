name: CI

# This repo's own PR CI. It dogfoods the shared ci.yml: the `ci` job lints the
# workflows, and the other jobs run ci.yml against the fixtures in fixtures/.
# `node` runs `layout: matrix`, the others the default `single`. `red` proves
# gate catches a failed slot inside `ci / checks` (red on purpose; `red / gate`
# stays green). `docs-only` proves a PR whose files are
# all ignored skips every slot and still passes gate.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      # Pinned: @latest lets a new release change what blocks every PR.
      lint_command: >-
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 &&
        "$(go env GOPATH)/bin/actionlint" -color -shellcheck=""

  node:
    uses: ./.github/workflows/ci.yml
    with:
      preset: node
      layout: matrix
      working_directory: fixtures/node
      paths_ignore: ""

  python:
    uses: ./.github/workflows/ci.yml
    with:
      preset: python
      working_directory: fixtures/python
      paths_ignore: ""

  shell:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: ""

  red:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: ""
      test_command: "exit 1"
      expect_failure: true

  docs-only:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: "**"
