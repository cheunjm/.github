name: Checks

# This repo's own PR CI. It dogfoods the shared CI: the `ci` job lints the workflows,
# and the others run it against the fixtures in fixtures/. `node` uses ci-matrix.yml (a
# check per slot); the rest use ci.yml (one `gate` job). `red` proves the gate catches a
# failed slot (expect_failure inverts it, so `red / gate` is green). `docs-only` proves
# a PR whose files are all ignored runs nothing and still passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      test_command: >-
        python3 -m unittest scripts/test_studio_lock.py scripts/test_release_gate.py
        scripts/test_contract_check.py scripts/test_sync_app_json.py
        scripts/test_cd_plan.py scripts/test_cd_app.py
      # Pinned: @latest lets a new release change what blocks every PR.
      lint_command: >-
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 &&
        "$(go env GOPATH)/bin/actionlint" -color -shellcheck=""

  node:
    uses: ./.github/workflows/ci-matrix.yml
    with:
      preset: node
      working_directory: fixtures/node
      paths_ignore: ""

  python:
    uses: ./.github/workflows/ci.yml
    with:
      preset: python
      working_directory: fixtures/python
      paths_ignore: ""

  shell:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: ""

  red:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: ""
      test_command: "exit 1"
      expect_failure: true

  docs-only:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: "**"

  studio-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: first
        uses: ./.github/actions/studio-lock
        with:
          mode: acquire
          slots: "2"
      - id: second
        uses: ./.github/actions/studio-lock
        with:
          mode: acquire
          slots: "2"
      - name: Slots differ
        env:
          FIRST: ${{ steps.first.outputs.slot }}
          SECOND: ${{ steps.second.outputs.slot }}
        run: |
          echo "slots: $FIRST $SECOND"
          [ -n "$FIRST" ] && [ -n "$SECOND" ] && [ "$FIRST" != "$SECOND" ]
      - uses: ./.github/actions/studio-lock
        with:
          mode: release
          slot: ${{ steps.first.outputs.slot }}
      - uses: ./.github/actions/studio-lock
        with:
          mode: release
          slot: ${{ steps.second.outputs.slot }}
      - name: Lock dir is empty
        run: |
          [ -z "$(ls -A "$HOME/Library/Caches/cheunjm-studio-lock")" ]

  # Wiring of db-migration-check: base_ref is the empty tree, so every fixture file counts as added.
  migrations-additive:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/db-migration-check.yml
    with:
      block_destructive: true
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      migration_paths: fixtures/migrations/additive/migrations/*.sql

  migrations-marked:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/db-migration-check.yml
    with:
      block_destructive: true
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      base_ref: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
      migration_paths: fixtures/migrations/marked/migrations/*.sql

  # The failing cases cannot go through `uses:` (a called workflow's failure cannot be
  # inverted), so each case is committed into a throwaway repo and the script is run on it;
  # a case marked `fail` must exit non-zero with the expected message.
  migration-guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: additive, command: scan, expect: pass}
          - {case: destructive, command: scan, expect: fail, message: 'migrations/1.sql:1 is a contract change: add "-- contract: safe after vX.Y.Z" and a minor changeset'}
          - {case: marked, command: scan, expect: pass}
          - {case: contract-patch, command: changeset, expect: fail, message: a contract migration needs a minor changeset}
          - {case: contract-minor, command: changeset, expect: pass}
    steps:
      - uses: actions/checkout@v7
      - name: Run ${{ matrix.command }} on ${{ matrix.case }} (expect ${{ matrix.expect }})
        env:
          CASE: ${{ matrix.case }}
          COMMAND: ${{ matrix.command }}
          EXPECT: ${{ matrix.expect }}
          MESSAGE: ${{ matrix.message }}
        run: |
          script="$PWD/scripts/contract_check.py"
          fixture="$PWD/fixtures/migrations/$CASE"
          work="$(mktemp -d)"
          git -C "$work" init -q -b main
          git -C "$work" -c user.name=t -c user.email=t@t commit -q --allow-empty -m base
          base="$(git -C "$work" rev-parse HEAD)"
          cp -R "$fixture/." "$work/"
          git -C "$work" add -A
          git -C "$work" -c user.name=t -c user.email=t@t commit -q -m case
          cd "$work" || exit 1
          rc=0
          python3 "$script" "$COMMAND" --base "$base" --head HEAD --paths 'migrations/**' > out.txt 2>&1 || rc=$?
          cat out.txt
          if [ "$EXPECT" = pass ]; then
            [ "$rc" -eq 0 ]
          else
            [ "$rc" -eq 1 ] && grep -qF -- "$MESSAGE" out.txt
          fi

  # Runs the real version script (changeset version with the pinned CLI, then the app.json
  # sync) on a temp copy of fixtures/expo: app.json must land on the bumped package.json version.
  app-json-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Version a copy of fixtures/expo
        env:
          CLI_VERSION: "3.0.3"
        run: |
          work="$(mktemp -d)"
          cp -R fixtures/expo/. "$work/"
          cd "$work" || exit 1
          git init -q
          npm install --no-save --no-package-lock --no-audit --no-fund "@changesets/cli@$CLI_VERSION"
          # Same path as the workflow: the prepare script exports APP_JSON and VERSION_SCRIPT
          # (here to a fake GITHUB_ENV file), and the action then runs `bash $VERSION_SCRIPT`
          # with that environment.
          export GITHUB_ENV="$work/.github_env"
          APP_JSON_INPUT=app.json bash "$GITHUB_WORKSPACE/scripts/version_prepare.sh"
          set -a
          # shellcheck source=/dev/null
          . "$GITHUB_ENV"
          set +a
          bash "$VERSION_SCRIPT"
          pkg="$(node -p 'require("./package.json").version')"
          app="$(node -p 'require("./app.json").expo.version')"
          echo "package.json $pkg, app.json $app"
          [ "$pkg" = "1.1.0" ] && [ "$app" = "$pkg" ]

  # cd.yml dry runs against fixtures/expo (INF-1983 D40-D46). scripts_ref is this PR's head,
  # so they exercise this PR's scripts. No secrets: dry runs pass without EXPO_TOKEN.
  cd-develop:
    permissions:
      contents: read
      statuses: write
      checks: read
    uses: ./.github/workflows/cd.yml
    with:
      environment: develop
      dry_run: true
      working_directory: fixtures/expo
      install_command: ""
      eas_runner: ubuntu-latest
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      backend: true
      app: true
      web: true
      storybook: true
      e2e: true
      firebase_groups: internal
      sideload_apk: true

  # No environment: nothing deploys and every target job is skipped.
  cd-empty:
    permissions:
      contents: read
      statuses: write
      checks: read
    uses: ./.github/workflows/cd.yml
    with:
      dry_run: true
      working_directory: fixtures/expo
      eas_runner: ubuntu-latest
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      backend: true
      app: true
      web: true
      storybook: true
      e2e: true

  latest-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tag="$(git ls-remote --tags --refs "$REPO_URL" 'v*' | sed 's|.*refs/tags/||' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
          echo "latest stable tag: $tag"
          [ -n "$tag" ]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # This repo's own latest release has no develop deploy behind it, so the master gate must
  # refuse it. The called workflow cannot be inverted from here, so cd.yml's expect_failure
  # does it: plan passes only when the gate failed. This repo's checks run on pull requests
  # only, so a release commit has no `ci / gate` and the gate stops at its second check.
  cd-master-gate:
    needs: latest-tag
    permissions:
      contents: read
      statuses: write
      checks: read
      actions: read
    uses: ./.github/workflows/cd.yml
    with:
      environment: master
      tag: ${{ needs.latest-tag.outputs.tag }}
      dry_run: true
      ignore_pending_migrations: true
      eas_runner: ubuntu-latest
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      expect_failure: "`ci / gate` is not green on"

  # backend is off and the fixture has a migration the stub lists as missing remotely.
  cd-pending-migrations:
    permissions:
      contents: read
      statuses: write
      checks: read
    uses: ./.github/workflows/cd.yml
    with:
      environment: develop
      dry_run: true
      working_directory: fixtures/expo
      eas_runner: ubuntu-latest
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      migration_list_stub: supabase/migration-list.json
      expect_failure: "1 local migration is not on the remote database"

  cd-pending-migrations-ignored:
    permissions:
      contents: read
      statuses: write
      checks: read
    uses: ./.github/workflows/cd.yml
    with:
      environment: develop
      dry_run: true
      working_directory: fixtures/expo
      eas_runner: ubuntu-latest
      scripts_ref: ${{ github.event.pull_request.head.sha }}
      migration_list_stub: supabase/migration-list.json
      ignore_pending_migrations: true

  # expect_failure must never turn a failed guard into a pass on a real run. A called
  # workflow's failure cannot be inverted here, so this checks cd.yml's three conditions.
  cd-expect-failure-dry-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: expect_failure is gated on dry_run
        run: |
          f=.github/workflows/cd.yml
          n="$(grep -cF "continue-on-error: "'$'"{{ inputs.expect_failure != '' && inputs.dry_run }}" "$f")"
          [ "$n" -eq 2 ] || { echo "::error::expected 2 dry_run-gated continue-on-error lines, found $n"; exit 1; }
          if grep -F "continue-on-error" "$f" | grep -F "expect_failure" | grep -vqF "&& inputs.dry_run"; then
            echo "::error::a continue-on-error on expect_failure is not gated on dry_run"; exit 1
          fi
          grep -qF "if: inputs.expect_failure != '' && !inputs.dry_run" "$f" || { echo "::error::the real-run refusal step is missing"; exit 1; }
          grep -qF "expect_failure is for dry runs" "$f" || { echo "::error::the refusal message is missing"; exit 1; }
          grep -qF "if: inputs.expect_failure != '' && inputs.dry_run" "$f" || { echo "::error::Expected failure step is not dry_run-gated"; exit 1; }
          for job in develop-status e2e-status; do
            line="$(awk -v j="  $job:" '$0 == j {f=1} f && /^    runs-on:/ {exit} f && /^    if:/ {g=1} f && g {print}' "$f")"
            case "$line" in *'!inputs.dry_run'*) ;; *) echo "::error::$job is not skipped in dry runs"; exit 1 ;; esac
          done
          echo "expect_failure is inert outside dry runs"
