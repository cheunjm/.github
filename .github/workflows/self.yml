name: Checks

# This repo's own PR CI. It dogfoods the shared CI: the `ci` job lints the workflows,
# and the others run it against the fixtures in fixtures/. `node` uses ci-matrix.yml (a
# check per slot); the rest use ci.yml (one `gate` job). `red` proves the gate catches a
# failed slot (expect_failure inverts it, so `red / gate` is green). `docs-only` proves
# a PR whose files are all ignored runs nothing and still passes.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      # Pinned: @latest lets a new release change what blocks every PR.
      lint_command: >-
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 &&
        "$(go env GOPATH)/bin/actionlint" -color -shellcheck=""

  node:
    uses: ./.github/workflows/ci-matrix.yml
    with:
      preset: node
      working_directory: fixtures/node
      paths_ignore: ""

  python:
    uses: ./.github/workflows/ci.yml
    with:
      preset: python
      working_directory: fixtures/python
      paths_ignore: ""

  shell:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: ""

  red:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: ""
      test_command: "exit 1"
      expect_failure: true

  docs-only:
    uses: ./.github/workflows/ci.yml
    with:
      preset: shell
      working_directory: fixtures/shell
      paths_ignore: "**"
