name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  actionlint:
    name: Validate workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          # Pinned: @latest lets a new release change what blocks every PR. The Go
          # checksum database verifies the exact version. Bump deliberately.
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color -shellcheck=""
