name: Checks

# Shared, stack-agnostic CI in one job (INF-1983, D5, D34, D35). With caller job id
# `ci` the only check is `ci / gate`, which rulesets require. The job resolves which
# slots run (lint, typecheck, test, format, audit, build), runs them in order, each in
# its own log group with a pass/fail line in the job summary, and fails if any slot
# failed. A failed slot does not stop the others, so one run reports every failure.
# One billed minute per run (plus slot time); ci-matrix.yml is the opt-in variant
# with a job and check per slot.
#
# A `preset` (node, python, shell) supplies each slot's default command. A
# `<slot>_command` input overrides it; the literal `none` turns the slot off.
#
# Paths: on pull requests, slots run only when at least one changed file is not
# matched by `paths_ignore` (fnmatch globs, one per line). Otherwise the gate passes
# without running anything. Other events always run. An empty `paths_ignore` always runs.
#
# This file sets no `permissions:`; callers grant `contents: read`, plus
# `checks: write` when `test_reports` is true. Callers also run on push to the
# default branch: the release button needs `ci / gate` on its HEAD.
#
#   name: Checks
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#     push:
#       branches: [main]
#   permissions:
#     contents: read
#   jobs:
#     ci:
#       uses: cheunjm/.github/.github/workflows/ci.yml@v1
#       secrets: inherit
#       with:
#         preset: node
#         typecheck_command: npm run check-types

on:
  workflow_call:
    inputs:
      preset:
        description: "Default commands: node, python or shell"
        type: string
        required: true
      runner:
        description: "Runner label for every job"
        type: string
        required: false
        default: "ubuntu-latest"
      working_directory:
        description: "Directory the install and slot commands run in"
        type: string
        required: false
        default: "."
      paths_ignore:
        description: "Newline-separated globs; a PR touching only these files skips every slot"
        type: string
        required: false
        default: |
          *.md
          **/*.md
          .changeset/**
          docs/**
          openwiki/**
      node_version:
        type: string
        required: false
        default: "20"
      python_version:
        type: string
        required: false
        default: "3.12"
      ruff_version:
        type: string
        required: false
        default: "0.16.8"
      mypy_version:
        type: string
        required: false
        default: "1.19.1"
      apt_packages:
        description: "Space-separated apt packages installed before each slot (e.g. jq)"
        type: string
        required: false
        default: ""
      install_command:
        description: "Override the preset install step. `none` skips it."
        type: string
        required: false
        default: ""
      lint_command:
        type: string
        required: false
        default: ""
      typecheck_command:
        type: string
        required: false
        default: ""
      test_command:
        type: string
        required: false
        default: ""
      format_command:
        type: string
        required: false
        default: ""
      audit_command:
        type: string
        required: false
        default: ""
      build_command:
        type: string
        required: false
        default: ""
      registry_scope:
        description: "npm scope read from GitHub Packages (e.g. @cheunjm). Needs PKG_READ_TOKEN."
        type: string
        required: false
        default: ""
      test_reports:
        description: "Upload JUnit results and publish a test report (jest-junit; caller grants checks: write)"
        type: boolean
        required: false
        default: false
      codecov:
        description: "Send coverage to Codecov after the tests. Needs CODECOV_TOKEN."
        type: boolean
        required: false
        default: false
      codecov_directory:
        type: string
        required: false
        default: ""
      codecov_flags:
        type: string
        required: false
        default: ""
      turbo_team:
        description: "Turborepo remote cache team. Pair with TURBO_TOKEN."
        type: string
        required: false
        default: ""
      expect_failure:
        description: "Self-test only: gate passes only if a slot failed"
        type: boolean
        required: false
        default: false
    secrets:
      PKG_READ_TOKEN:
        required: false
      CODECOV_TOKEN:
        required: false
      TURBO_TOKEN:
        required: false

jobs:
  gate:
    name: gate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve slots
        working-directory: .
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRESET: ${{ inputs.preset }}
          PATHS_IGNORE: ${{ inputs.paths_ignore }}
          INSTALL: ${{ inputs.install_command }}
          LINT: ${{ inputs.lint_command }}
          TYPECHECK: ${{ inputs.typecheck_command }}
          TEST: ${{ inputs.test_command }}
          FORMAT: ${{ inputs.format_command }}
          AUDIT: ${{ inputs.audit_command }}
          BUILD: ${{ inputs.build_command }}
        run: |
          python3 - <<'PY'
          import fnmatch, json, os, subprocess, sys

          e = os.environ
          presets = {
              "node": {
                  "install": "npm ci",
                  "lint": "npm run lint",
                  "typecheck": "npm run typecheck",
                  "test": "npm run test",
                  "format": "npm run format:check",
                  "audit": "npm audit --audit-level=critical --omit=dev",
              },
              "python": {
                  "install": 'python3 -m pip install "ruff==$RUFF_VERSION" "mypy==$MYPY_VERSION"'
                             ' && if [ -f requirements.txt ]; then python3 -m pip install -r requirements.txt; fi',
                  "lint": "ruff check .",
                  "test": 'python3 -m unittest discover -s . -p "test_*.py" -v',
                  "format": "ruff format --check .",
              },
              "shell": {
                  "lint": "git ls-files -z '*.sh' | xargs -0 -r shellcheck -S warning",
              },
          }
          preset = e["PRESET"]
          if preset not in presets:
              sys.exit(f"::error::unknown preset {preset!r} (node, python, shell)")
          defaults = presets[preset]

          def effective(key, override):
              if override.strip() == "none":
                  return ""
              return override.strip() or defaults.get(key, "")

          run = True
          ignore = [g.strip() for g in e["PATHS_IGNORE"].splitlines() if g.strip()]
          if e["EVENT"] == "pull_request" and ignore:
              diff = subprocess.run(
                  ["git", "diff", "--name-only", f"{e['BASE_SHA']}...HEAD"],
                  check=True, capture_output=True, text=True,
              ).stdout.split()
              run = any(not any(fnmatch.fnmatch(f, g) for g in ignore) for f in diff)
              print(f"{len(diff)} changed files; slots {'run' if run else 'skipped (all ignored)'}")

          install = effective("install", e["INSTALL"])
          slots = []
          if run:
              for slot in ["lint", "typecheck", "test", "format", "audit", "build"]:
                  cmd = effective(slot, e[slot.upper()])
                  if cmd:
                      slots.append({"slot": slot, "cmd": cmd, "install": install})
          print("slots:", [s["slot"] for s in slots])
          with open(e["GITHUB_OUTPUT"], "a") as out:
              out.write(f"slots={json.dumps(slots)}\n")
              out.write(f"install={install}\n")
              out.write(f"has_test={'true' if any(s['slot'] == 'test' for s in slots) else 'false'}\n")
          PY


      - name: Install apt packages
        if: ${{ steps.resolve.outputs.slots != '[]' && inputs.apt_packages != '' }}
        env:
          PACKAGES: ${{ inputs.apt_packages }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # word splitting is the point
          sudo apt-get install -y -qq $PACKAGES
      - uses: actions/setup-node@v7
        if: ${{ steps.resolve.outputs.slots != '[]' && inputs.preset == 'node' }}
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
          registry-url: ${{ inputs.registry_scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.registry_scope }}
      - uses: actions/setup-python@v7
        if: ${{ steps.resolve.outputs.slots != '[]' && inputs.preset == 'python' }}
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install
        if: ${{ steps.resolve.outputs.slots != '[]' && steps.resolve.outputs.install != '' }}
        env:
          CMD: ${{ steps.resolve.outputs.install }}
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          RUFF_VERSION: ${{ inputs.ruff_version }}
          MYPY_VERSION: ${{ inputs.mypy_version }}
        run: bash -euo pipefail -c "$CMD"
      - name: Run slots
        id: run
        if: ${{ steps.resolve.outputs.slots != '[]' }}
        env:
          SLOTS: ${{ steps.resolve.outputs.slots }}
          TURBO_TOKEN: ${{ inputs.turbo_team != '' && secrets.TURBO_TOKEN || '' }}
          TURBO_TEAM: ${{ inputs.turbo_team }}
          TEST_REPORTS: ${{ inputs.test_reports }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          failed = []
          lines = ["| Slot | Result |", "|---|---|"]
          for s in json.loads(os.environ["SLOTS"]):
              env = dict(os.environ)
              if s["slot"] == "test" and env["TEST_REPORTS"] == "true":
                  env["JEST_JUNIT_OUTPUT_DIR"] = "test-results"
                  env["JEST_JUNIT_OUTPUT_NAME"] = "junit.xml"
              print(f"::group::{s['slot']}", flush=True)
              code = subprocess.run(["bash", "-euo", "pipefail", "-c", s["cmd"]], env=env).returncode
              print("::endgroup::", flush=True)
              if code:
                  failed.append(s["slot"])
                  print(f"::error title={s['slot']}::{s['slot']} failed (exit {code})", flush=True)
              lines.append(f"| {s['slot']} | {'failed' if code else 'passed'} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("\n".join(lines) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"failed={' '.join(failed)}\n")
          PY
      - name: Upload test results
        if: ${{ always() && inputs.test_reports && steps.resolve.outputs.has_test == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results/"
          if-no-files-found: ignore
          retention-days: 7
      - name: Test report
        if: ${{ always() && inputs.test_reports && steps.resolve.outputs.has_test == 'true' }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        with:
          name: Unit Tests
          path: "**/test-results/*.xml"
          reporter: jest-junit
          fail-on-empty: false
      - name: Upload coverage to Codecov
        if: ${{ always() && inputs.codecov && steps.resolve.outputs.has_test == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ inputs.codecov_directory }}
          flags: ${{ inputs.codecov_flags }}
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: ${{ always() && inputs.codecov && inputs.codecov_directory != '' && steps.resolve.outputs.has_test == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ${{ inputs.working_directory }}/${{ inputs.codecov_directory }}/
          if-no-files-found: ignore
      - name: Gate
        if: ${{ always() }}
        env:
          SLOTS: ${{ steps.resolve.outputs.slots }}
          RESOLVE: ${{ steps.resolve.outcome }}
          SETUP_OK: ${{ steps.run.outcome != 'failure' && steps.run.outcome != 'cancelled' }}
          FAILED: ${{ steps.run.outputs.failed }}
          EXPECT_FAILURE: ${{ inputs.expect_failure }}
          JOB_STATUS: ${{ job.status }}
        working-directory: .
        run: |
          # A failed slot, or a failed setup before the slots ran, fails the gate.
          # No slots to run (all paths ignored, or every slot off) passes.
          if [ "$RESOLVE" != "success" ]; then echo "::error::could not resolve slots"; exit 1; fi
          failed=false
          if [ -n "$FAILED" ] || [ "$SETUP_OK" != "true" ]; then failed=true; fi
          if [ "$SLOTS" != "[]" ] && [ -z "$FAILED" ] && [ "$JOB_STATUS" != "success" ]; then failed=true; fi
          if [ "$EXPECT_FAILURE" = "true" ]; then
            if [ "$failed" = "true" ]; then echo "A slot failed, as expected"; exit 0; fi
            echo "::error::expect_failure is set but no slot failed"; exit 1
          fi
          if [ "$failed" = "true" ]; then echo "::error::failed slots: ${FAILED:-setup}"; exit 1; fi
          if [ "$SLOTS" = "[]" ]; then echo "No slots to run; passing"; else echo "All slots passed"; fi
