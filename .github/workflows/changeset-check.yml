name: Changeset

# Fails a PR that does not add a changeset. Every PR (and every stack layer)
# needs its own `.changeset/*.md`; docs/CI-only PRs add an empty one
# (`npx changeset add --empty`). The Version Packages PR is exempt.
#
# Callers name their workflow `Release notes` and use a job id of `changeset`,
# so the required check is `changeset / check` (shown as
# `Release notes / changeset / check`, INF-1983 D35):
#
#   name: Release notes
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   jobs:
#     changeset:
#       uses: cheunjm/.github/.github/workflows/changeset-check.yml@main
#       permissions:
#         contents: read

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Empty uses the calling repo's CI_RUNNER variable (e.g. mac-studio), then ubuntu-latest."
        required: false
        type: string
        default: ""
      migration_paths:
        description: >-
          Newline-separated git pathspec globs for SQL migrations (e.g.
          `supabase/migrations/**`). When the PR adds or changes a migration with a
          `-- contract:` line, one of its new changesets must give this repo's
          package `minor` (INF-1983 D42, D43). Empty skips the check.
        required: false
        type: string
        default: ""
      scripts_ref:
        description: "Ref of cheunjm/.github to fetch the guard scripts from (tag, branch or SHA). Default v1."
        required: false
        type: string
        default: "v1"
      changesets-version:
        description: "Pinned @changesets/cli version"
        required: false
        type: string
        default: "3.0.3"

permissions:
  contents: read

jobs:
  check:
    # The Version Packages PR consumes changesets instead of adding them, and
    # Dependabot cannot write one (INF-1821).
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ${{ inputs.runner || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a new changeset file
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Diff against the PR's own base (not main) so each stack layer
          # needs its own changeset.
          git fetch --no-tags origin "$BASE_REF"
          if [ ! -f .changeset/config.json ]; then
            echo "::error::No .changeset/config.json in this repo. Add changesets (see the changeset-* rows in the cheunjm/.github docs)."
            exit 1
          fi
          added=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" \
            | grep -E '^\.changeset/.+\.md$' | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$added" ]; then
            echo "::error::This PR adds no changeset. Run 'npx changeset' (or 'npx changeset add --empty' for docs/CI-only changes) and commit the file."
            exit 1
          fi
          echo "Changesets added by this PR:"
          echo "$added"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate changesets
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGESETS_VERSION: ${{ inputs.changesets-version }}
        run: |
          # Parses every changeset and rejects unknown package names, so a bad
          # file fails here and not later in the Version Packages PR.
          npx --yes "@changesets/cli@$CHANGESETS_VERSION" status --since="origin/$BASE_REF"

      - name: Require a minor changeset for contract migrations
        if: ${{ inputs.migration_paths != '' }}
        env:
          BASE_REF: ${{ github.base_ref }}
          MIGRATION_PATHS: ${{ inputs.migration_paths }}
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
        run: |
          # The script lives in cheunjm/.github (public), at `scripts_ref` (default v1).
          dir="$(mktemp -d "$RUNNER_TEMP/cheunjm-github.XXXXXX")"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/cheunjm/.github "$SCRIPTS_REF"
          git -C "$dir" checkout -q FETCH_HEAD
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          python3 "$dir/scripts/contract_check.py" changeset --base "$base" --head HEAD --paths "$MIGRATION_PATHS"
