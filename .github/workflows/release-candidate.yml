name: Release candidate

# The release button (INF-1983, D26/D27). Run it from a repo's thin
# `workflow_dispatch` caller to cut a prerelease of `main`:
#
#   1. refuses while the repo is in changesets pre mode (.changeset/pre.json);
#   2. refuses unless `ci / gate` passed on the commit being tagged;
#   3. version X.Y.Z = package.json's version bumped by the highest pending
#      changeset for this package, or the next patch when none is pending;
#   4. N = 1 + the highest existing vX.Y.Z-<channel>.N tag, or 0;
#   5. creates the tag vX.Y.Z-<channel>.N with the arami-bot token (so the tag
#      push triggers the repo's cd workflow, which deploys develop) and a
#      GitHub prerelease;
#   6. with `publish: true`, publishes X.Y.Z-<channel>.N to the npm registry
#      under the dist-tag <channel>. The version is set in CI only and never
#      committed.
#
# Only an `rc` can ship to master; a `next` is a develop build that cannot be
# released by accident. `dry_run` resolves and prints the tag, creating nothing.
#
#   name: Release candidate
#   on:
#     workflow_dispatch:
#       inputs:
#         channel:
#           type: choice
#           options: [rc, next]
#           default: rc
#   permissions:
#     contents: read
#   jobs:
#     cut:
#       uses: cheunjm/.github/.github/workflows/release-candidate.yml@v1
#       permissions:
#         contents: write
#         checks: read
#         packages: write   # only with publish: true
#       secrets: inherit
#       with:
#         channel: ${{ inputs.channel }}

on:
  workflow_call:
    inputs:
      channel:
        description: "Prerelease channel: rc (default, can ship to master) or next"
        type: string
        required: false
        default: "rc"
      publish:
        description: "Also publish the prerelease to the npm registry under the dist-tag <channel>"
        type: boolean
        required: false
        default: false
      trusted_publishing:
        description: "Publish to npmjs.org with npm trusted publishing (OIDC): npm >= 11.5.1 and no token. The caller grants `id-token: write`, and the npm package's trusted publisher must be the caller's workflow file (simplest: call this from the same release.yml that publishes stable releases). Without it, publishing uses the job token (GitHub Packages)."
        type: boolean
        required: false
        default: false
      install_command:
        description: "Install and build before publishing (only with publish: true). Runs without the registry token; the default skips dependency install scripts, which matters most with trusted_publishing"
        type: string
        required: false
        default: "npm ci --ignore-scripts"
      registry_url:
        description: "npm registry for publishing (e.g. https://npm.pkg.github.com)"
        type: string
        required: false
        default: ""
      scope:
        description: "npm scope for the registry (e.g. @cheunjm)"
        type: string
        required: false
        default: ""
      node_version:
        type: string
        required: false
        default: "22"
      dry_run:
        description: "Resolve and print the tag without creating anything"
        type: boolean
        required: false
        default: false
      runner:
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      BOT_APP_ID:
        required: false
      BOT_PRIVATE_KEY:
        required: false
    outputs:
      tag:
        description: "The tag cut (or that would be cut, in a dry run), e.g. v1.4.0-rc.0"
        value: ${{ jobs.cut.outputs.tag }}
      version:
        description: "The prerelease version, e.g. 1.4.0-rc.0"
        value: ${{ jobs.cut.outputs.version }}

jobs:
  cut:
    name: cut
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.registry_url }}
          scope: ${{ inputs.scope }}

      - name: Check the repo can cut a prerelease
        env:
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Only commits on the default branch can be released.
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$REF is not the default branch; a real run would stop here"
            else
              echo "::error::run this from $DEFAULT_BRANCH (got $REF)"
              exit 1
            fi
          fi
          case "$CHANNEL" in
            rc|next) ;;
            *) echo "::error::channel must be rc or next, got '$CHANNEL'"; exit 1 ;;
          esac
          # Pre mode blocks the button; a repo that is exiting pre mode (mode "exit",
          # waiting for its stable Version PR) may cut rcs of that stable version.
          if [ -f .changeset/pre.json ] && [ "$(node -p 'require("./.changeset/pre.json").mode')" = "pre" ]; then
            echo "::error::repo is in changesets pre mode (.changeset/pre.json); leave pre mode before using the release button"
            exit 1
          fi
          # The latest `ci / gate` run from GitHub Actions on this commit must
          # have succeeded; an older green run does not count.
          gate=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci%20%2F%20gate&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | (.conclusion // .status // "missing")')
          gate="${gate:-missing}"
          if [ "$gate" != "success" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::ci / gate is not green on $SHA ($gate); a real run would stop here"
            else
              echo "::error::ci / gate is not green on $SHA ($gate)"
              exit 1
            fi
          fi

      - name: Resolve the next prerelease
        id: resolve
        env:
          CHANNEL: ${{ inputs.channel }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # X.Y.Z: the highest bump any pending changeset gives this package,
          # applied to package.json's version (what `changeset version` would
          # produce for a single package); the next patch when none is pending.
          # shellcheck disable=SC2016 # JavaScript in single quotes, not shell
          base=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const rank = { none: 0, patch: 1, minor: 2, major: 3 };
            let bump = 1;
            const dir = ".changeset";
            for (const f of fs.existsSync(dir) ? fs.readdirSync(dir) : []) {
              if (!f.endsWith(".md") || f === "README.md") continue;
              const m = fs.readFileSync(`${dir}/${f}`, "utf8").match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!m) continue;
              for (const line of m[1].split(/\r?\n/)) {
                const r = line.match(/^\s*["\x27]?([^"\x27:]+)["\x27]?\s*:\s*(major|minor|patch|none)\s*$/);
                if (r && r[1].trim() === pkg.name) bump = Math.max(bump, rank[r[2]]);
              }
            }
            // Same result as semver.inc, which `changeset version` uses: from a
            // prerelease, a bump first lands on the release it was heading for.
            const [core, pre] = pkg.version.split("-");
            const [M, m2, p] = core.split(".").map(Number);
            let v;
            if (bump === 3) v = pre && m2 === 0 && p === 0 ? `${M}.0.0` : `${M + 1}.0.0`;
            else if (bump === 2) v = pre && p === 0 ? `${M}.${m2}.0` : `${M}.${m2 + 1}.0`;
            else v = pre ? `${M}.${m2}.${p}` : `${M}.${m2}.${p + 1}`;
            console.log(v);
          ')
          base="${base%%-*}"
          highest=$(gh api "repos/$REPO/git/matching-refs/tags/v$base-$CHANNEL." --jq '.[].ref' \
            | sed -E 's#^refs/tags/v[^-]+-[a-z]+\.([0-9]+)$#\1#' | grep -E '^[0-9]+$' | sort -n | tail -1)
          n=$(( ${highest:--1} + 1 ))
          version="$base-$CHANNEL.$n"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Next prerelease: v$version"
          echo "### Release candidate: \`v$version\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate GitHub App token
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create the tag and prerelease
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          # A git push, not the refs API (which answers 403 for the App when the
          # commit carries workflow files). Without --force the push fails if the
          # tag already exists (a concurrent press) instead of moving it. The
          # credential lives in .git/config only for this push, before any
          # install or publish step runs.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
          git tag "$TAG" "$SHA"
          status=0
          git push origin "refs/tags/$TAG" || status=$?
          git config --local --unset-all http.https://github.com/.extraheader
          [ "$status" -eq 0 ] || { echo "::error::could not push $TAG (it may already exist)"; exit "$status"; }
          gh release create "$TAG" --repo "$REPO" --prerelease --generate-notes --verify-tag

      - name: Install and build for publishing
        # No registry token here. With trusted_publishing the job can mint an OIDC token
        # in any step (per-job permissions are not available inside a reusable workflow),
        # so the default install skips dependency lifecycle scripts; this step only runs
        # code from the default branch, as the stable publish in changeset-version does.
        if: ${{ !inputs.dry_run && inputs.publish }}
        env:
          INSTALL: ${{ inputs.install_command }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [ -n "$INSTALL" ]; then bash -euo pipefail -c "$INSTALL"; fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Upgrade npm for trusted publishing
        if: ${{ !inputs.dry_run && inputs.publish && inputs.trusted_publishing }}
        # OIDC publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install -g npm@^11.5.1

      - name: Publish the prerelease
        # Any token is scoped to this step, and --ignore-scripts keeps package
        # lifecycle scripts from running with it. Build in install_command.
        # Trusted publishing sends no token, so npm uses the OIDC exchange.
        if: ${{ !inputs.dry_run && inputs.publish }}
        env:
          CHANNEL: ${{ inputs.channel }}
          NODE_AUTH_TOKEN: ${{ !inputs.trusted_publishing && github.token || '' }}
        run: npm publish --tag "$CHANNEL" --ignore-scripts
