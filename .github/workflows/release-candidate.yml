name: Release candidate

# The release button (INF-1983, D46). Run it from a repo's thin
# `workflow_dispatch` caller to release `main` to develop. It creates no tag and
# no GitHub prerelease; it only checks and computes, and the caller's cd deploys
# the output `ref`:
#
#   1. refuses unless it runs on the default branch;
#   2. refuses while the repo is in changesets pre mode (.changeset/pre.json);
#   3. refuses unless `ci / gate` passed on the commit being released;
#   4. version X.Y.Z = package.json's version bumped by the highest pending
#      changeset for this package, or the next patch when none is pending;
#   5. outputs `version` (X.Y.Z) and `ref` (the SHA to deploy);
#   6. with `publish: true`, publishes X.Y.Z-next.N to the npm registry under
#      the dist-tag `next`, N = 1 + the highest X.Y.Z-next.* already on the
#      registry (0 when none). The version is set in CI only, never committed.
#
# `dry_run` prints what it would do and changes nothing.
#
#   name: Release candidate
#   on:
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     cut:
#       uses: cheunjm/.github/.github/workflows/release-candidate.yml@v1
#       permissions:
#         contents: read
#         checks: read
#         packages: write   # only with publish: true

on:
  workflow_call:
    inputs:
      channel:
        description: "Deprecated and ignored (D46): there are no rc tags. With publish, the npm dist-tag is always next"
        type: string
        required: false
        default: "rc"
      publish:
        description: "Also publish X.Y.Z-next.N to the npm registry under the dist-tag next"
        type: boolean
        required: false
        default: false
      trusted_publishing:
        description: "Publish to npmjs.org with npm trusted publishing (OIDC): npm >= 11.5.1 and no token. The caller grants `id-token: write`, and the npm package's trusted publisher must be the caller's workflow file (simplest: call this from the same release.yml that publishes stable releases). Without it, publishing uses the job token (GitHub Packages)."
        type: boolean
        required: false
        default: false
      install_command:
        description: "Install and build before publishing (only with publish: true). Runs without the registry token; the default skips dependency install scripts, which matters most with trusted_publishing"
        type: string
        required: false
        default: "npm ci --ignore-scripts"
      registry_url:
        description: "npm registry for publishing (e.g. https://npm.pkg.github.com)"
        type: string
        required: false
        default: ""
      scope:
        description: "npm scope for the registry (e.g. @cheunjm)"
        type: string
        required: false
        default: ""
      node_version:
        type: string
        required: false
        default: "22"
      dry_run:
        description: "Print the version, ref and (with publish) the npm version without publishing anything"
        type: boolean
        required: false
        default: false
      runner:
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      BOT_APP_ID:
        description: "Deprecated and unused (no tag is pushed any more); kept so callers with secrets: inherit or explicit secrets still validate"
        required: false
      BOT_PRIVATE_KEY:
        description: "Deprecated and unused; see BOT_APP_ID"
        required: false
    outputs:
      tag:
        description: "Always empty; kept for callers until v2"
        value: ${{ jobs.cut.outputs.tag }}
      version:
        description: "The version X.Y.Z the develop build carries, e.g. 1.4.0"
        value: ${{ jobs.cut.outputs.version }}
      ref:
        description: "The commit SHA to deploy to develop"
        value: ${{ jobs.cut.outputs.ref }}

jobs:
  cut:
    name: cut
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    outputs:
      tag: ""
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          registry-url: ${{ inputs.registry_url }}
          scope: ${{ inputs.scope }}

      - name: Check the repo can be released
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Only commits on the default branch can be released.
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$REF is not the default branch; a real run would stop here"
            else
              echo "::error::run this from $DEFAULT_BRANCH (got $REF)"
              exit 1
            fi
          fi
          # Pre mode blocks the button; a repo that is exiting pre mode (mode "exit",
          # waiting for its stable Version PR) may still release the coming stable version.
          if [ -f .changeset/pre.json ] && [ "$(node -p 'require("./.changeset/pre.json").mode')" = "pre" ]; then
            echo "::error::repo is in changesets pre mode (.changeset/pre.json); leave pre mode before using the release button"
            exit 1
          fi
          # The latest `ci / gate` run from GitHub Actions on this commit must
          # have succeeded; an older green run does not count.
          gate=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci%20%2F%20gate&filter=latest" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | (.conclusion // .status // "missing")')
          gate="${gate:-missing}"
          if [ "$gate" != "success" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::ci / gate is not green on $SHA ($gate); a real run would stop here"
            else
              echo "::error::ci / gate is not green on $SHA ($gate)"
              exit 1
            fi
          fi

      - name: Resolve the version
        id: resolve
        env:
          SHA: ${{ github.sha }}
        run: |
          # X.Y.Z: the highest bump any pending changeset gives this package,
          # applied to package.json's version (what `changeset version` would
          # produce for a single package); the next patch when none is pending.
          # shellcheck disable=SC2016 # JavaScript in single quotes, not shell
          base=$(node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const rank = { none: 0, patch: 1, minor: 2, major: 3 };
            let bump = 1;
            const dir = ".changeset";
            for (const f of fs.existsSync(dir) ? fs.readdirSync(dir) : []) {
              if (!f.endsWith(".md") || f === "README.md") continue;
              const m = fs.readFileSync(`${dir}/${f}`, "utf8").match(/^---\r?\n([\s\S]*?)\r?\n---/);
              if (!m) continue;
              for (const line of m[1].split(/\r?\n/)) {
                const r = line.match(/^\s*["\x27]?([^"\x27:]+)["\x27]?\s*:\s*(major|minor|patch|none)\s*$/);
                if (r && r[1].trim() === pkg.name) bump = Math.max(bump, rank[r[2]]);
              }
            }
            // Same result as semver.inc, which `changeset version` uses: from a
            // prerelease, a bump first lands on the release it was heading for.
            const [core, pre] = pkg.version.split("-");
            const [M, m2, p] = core.split(".").map(Number);
            let v;
            if (bump === 3) v = pre && m2 === 0 && p === 0 ? `${M}.0.0` : `${M + 1}.0.0`;
            else if (bump === 2) v = pre && p === 0 ? `${M}.${m2}.0` : `${M}.${m2 + 1}.0`;
            else v = pre ? `${M}.${m2}.${p}` : `${M}.${m2}.${p + 1}`;
            console.log(v);
          ')
          version="${base%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          echo "Release version: $version (ref $SHA)"
          echo "### Release: \`$version\` at \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the next npm prerelease
        # Read-only, so a dry run prints the version it would publish. The token
        # (GitHub Packages) is scoped to this step; npmjs.org reads need none.
        if: ${{ inputs.publish }}
        id: npm
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          NODE_AUTH_TOKEN: ${{ !inputs.trusted_publishing && github.token || '' }}
        run: |
          name=$(node -p 'require("./package.json").name')
          status=0
          out=$(npm view "$name" versions --json 2>&1) || status=$?
          if [ "$status" -ne 0 ]; then
            case "$out" in
              *E404*) out='[]' ;;
              *) echo "::error::npm view $name failed: $out"; exit "$status" ;;
            esac
          fi
          # shellcheck disable=SC2016 # JavaScript in single quotes, not shell
          n=$(VERSIONS="$out" node -e '
            const raw = JSON.parse(process.env.VERSIONS || "[]");
            const all = Array.isArray(raw) ? raw : [raw];
            const prefix = `${process.env.VERSION}-next.`;
            let n = -1;
            for (const v of all) {
              if (!v.startsWith(prefix)) continue;
              const k = v.slice(prefix.length);
              if (/^[0-9]+$/.test(k)) n = Math.max(n, Number(k));
            }
            console.log(n + 1);
          ')
          npm_version="$VERSION-next.$n"
          echo "npm_version=$npm_version" >> "$GITHUB_OUTPUT"
          echo "npm prerelease version: $npm_version (dist-tag next)"
          echo "npm prerelease: \`$npm_version\` (dist-tag next)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install and build for publishing
        # No registry token here. With trusted_publishing the job can mint an OIDC token
        # in any step (per-job permissions are not available inside a reusable workflow),
        # so the default install skips dependency lifecycle scripts; this step only runs
        # code from the default branch, as the stable publish in changeset-version does.
        if: ${{ !inputs.dry_run && inputs.publish }}
        env:
          INSTALL: ${{ inputs.install_command }}
          VERSION: ${{ steps.npm.outputs.npm_version }}
        run: |
          if [ -n "$INSTALL" ]; then bash -euo pipefail -c "$INSTALL"; fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Upgrade npm for trusted publishing
        if: ${{ !inputs.dry_run && inputs.publish && inputs.trusted_publishing }}
        # OIDC publishing needs npm >= 11.5.1; Node 22 ships npm 10.
        run: npm install -g npm@^11.5.1

      - name: Publish the npm prerelease
        # Any token is scoped to this step, and --ignore-scripts keeps package
        # lifecycle scripts from running with it. Build in install_command.
        # Trusted publishing sends no token, so npm uses the OIDC exchange.
        if: ${{ !inputs.dry_run && inputs.publish }}
        env:
          NODE_AUTH_TOKEN: ${{ !inputs.trusted_publishing && github.token || '' }}
        run: npm publish --tag next --ignore-scripts
