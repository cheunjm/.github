name: Wiki

# Reusable: generate or update a repository's OpenWiki (https://github.com/langchain-ai/openwiki)
# through an OpenAI-compatible endpoint (LiteLLM), open a docs PR, and merge it.
#
# Update runs (init: false) squash-merge the PR themselves, only when every changed
# path is under openwiki/ (plus .changeset/ when `changeset` is true) and a diff-only
# secret scan is clean. The merge subject carries [skip ci] so push-triggered deploy
# workflows do not run for bot docs commits. Any guard or scan failure leaves the PR
# open and fails the run. Init runs (init: true) never merge: the setup PR also adds
# the AGENTS.md / CLAUDE.md pointers, which a human reviews.
#
# Token: the built-in GITHUB_TOKEN by default. That needs the repo setting "Allow GitHub
# Actions to create and approve pull requests", and it is enough for repos without required
# status checks (PRs and merges made with it trigger no other workflows). Repos that require
# status checks need `use_app: true`: a GitHub App token, so the checks run on the bot PR.
#
# Two jobs, so the agent never shares a job with a write token: `generate` runs the agent
# with a read-only token and uploads openwiki/ as an artifact; `publish` validates and copies
# in only allowlisted regular files, then guards, scans, opens the PR and merges.
# `generate` runs on `runner`, default `mac-studio-openwiki` (INF-1983, D28): every repo has a Studio
# runner with that label that does no mobile work, so a long generation never queues behind or
# blocks an EAS build or native e2e. The model is the Studio's LiteLLM (:4001, the ChatGPT
# subscription), so callers pass nothing. The repo variable OPENWIKI_RUNNER still overrides the
# `generate` runner until v2. `publish`, which holds the write token, runs on `ubuntu-latest`
# unless `publish_runner` says otherwise: a persistent self-hosted runner could leave a process
# the agent started running next to it. On a self-hosted publish runner the job still wipes its
# workspace (planted .git hooks or config) before a fresh checkout.
#
# Caller secrets (pass with `secrets: inherit`):
#   LITELLM_API_KEY   key for the OpenAI-compatible endpoint
#   APP_ID, APP_PRIVATE_KEY   only with use_app: true
# Protected branches: the merge falls back to --auto, which needs "Allow auto-merge".

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label. Default mac-studio-openwiki: a Studio runner that does no mobile work (D28)"
        required: false
        type: string
        default: "mac-studio-openwiki"
      publish_runner:
        description: "Runner for the publish job (default: ubuntu-latest, isolated from the agent)"
        required: false
        type: string
        default: ""
      base_url:
        description: "OpenAI-compatible base URL (the Studio's openwiki LiteLLM instance)"
        required: false
        type: string
        default: "http://127.0.0.1:4001/v1"
      model_id:
        description: "Model alias exposed by the endpoint"
        required: false
        type: string
        default: "gpt-6.1-sol"
      use_responses_api:
        description: "Use the Responses API (for endpoints that serve models in Responses mode)"
        required: false
        type: boolean
        default: true
      init:
        description: "Generate the initial wiki (opens a PR for review, never merges)"
        required: false
        type: boolean
        default: false
      changeset:
        description: "Add an empty changeset so a required changeset check passes"
        required: false
        type: boolean
        default: false
      openwiki_version:
        description: "Pinned openwiki npm version"
        required: false
        type: string
        default: "0.5.0"
      use_app:
        description: "Use a GitHub App token (repos with required status checks)"
        required: false
        type: boolean
        default: false
    secrets:
      LITELLM_API_KEY:
        required: true
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  # Job 1 runs the untrusted agent: read-only token, nothing to publish with. It hands the
  # generated docs to job 2 as an artifact and nothing else.
  generate:
    name: generate
    runs-on: ${{ vars.OPENWIKI_RUNNER || inputs.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.openwiki.outcome }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install OpenWiki
        env:
          OPENWIKI_VERSION: ${{ inputs.openwiki_version }}
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/openwiki" "openwiki@${OPENWIKI_VERSION}" mermaid@11.16.0 jsdom@29.1.1
          echo "$RUNNER_TEMP/openwiki/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run OpenWiki
        id: openwiki
        continue-on-error: true
        env:
          MODE_FLAG: ${{ inputs.init && '--init' || '--update' }}
          OPENWIKI_PROVIDER: openai-compatible
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ inputs.base_url }}
          OPENWIKI_MODEL_ID: ${{ inputs.model_id }}
          OPENWIKI_OPENAI_COMPATIBLE_USE_RESPONSES_API: ${{ inputs.use_responses_api }}
        run: openwiki code "$MODE_FLAG" --print

      - name: Stage generated docs
        if: ${{ !cancelled() }}
        env:
          IS_INIT: ${{ inputs.init }}
        run: |
          set -euo pipefail
          rm -f -- openwiki/.run.json
          stage="$RUNNER_TEMP/openwiki-out"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ -d openwiki ]; then
            cp -R openwiki "$stage/openwiki"
          fi
          if [ "$IS_INIT" = "true" ]; then
            for f in AGENTS.md CLAUDE.md; do
              if [ -f "$f" ]; then cp "$f" "$stage/$f"; fi
            done
          fi

      - name: Upload generated docs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwiki-docs
          path: ${{ runner.temp }}/openwiki-out
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  # Job 2 holds the write token. It never executes agent output: it copies in only
  # allowlisted regular files, then guards, scans, opens the PR and merges.
  publish:
    name: publish
    needs: generate
    if: ${{ !cancelled() }}
    # Hosted by default: this job holds the write token and needs no model, so it never
    # shares the persistent Studio runner with the agent.
    runs-on: ${{ inputs.publish_runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    # Ignore system git config (see the Isolate git config step for the global one).
    env:
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      # The runner user's global git config (the Studio's has a gh credential helper that
      # would offer a personal token) must not be used. Point git at an empty, writable file
      # instead: actions that run `git config --global` (checkout, create-pull-request)
      # need to write to it, which /dev/null does not allow.
      - name: Isolate git config
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/gitconfig-isolated"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig-isolated" >> "$GITHUB_ENV"

      # A persistent runner keeps the previous job's workspace, including .git/hooks and
      # .git/config the agent could have planted. Start from an empty directory.
      - name: Wipe workspace
        run: |
          set -euo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Download generated docs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openwiki-docs
          path: ${{ runner.temp }}/artifact

      - name: Validate and copy generated docs
        id: stage
        env:
          IS_INIT: ${{ inputs.init }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/artifact"
          bad=""
          # Only regular files and directories: no symlinks, devices or sockets.
          if find "$a" ! -type f ! -type d -print -quit | grep -q .; then
            bad="$bad (non-regular file in artifact)"
          fi
          while IFS= read -r -d '' f; do
            rel="${f#"$a"/}"
            case "$rel" in
              openwiki/*) ;;
              AGENTS.md|CLAUDE.md) [ "$IS_INIT" = "true" ] || bad="$bad $rel" ;;
              *) bad="$bad $rel" ;;
            esac
          done < <(find "$a" -type f -print0)
          if [ -n "$bad" ]; then
            echo "::error::Unexpected content in the generated docs artifact:$bad"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -rf openwiki
          if [ -d "$a/openwiki" ]; then
            cp -R "$a/openwiki" openwiki
          fi
          if [ "$IS_INIT" = "true" ]; then
            for f in AGENTS.md CLAUDE.md; do
              if [ -f "$a/$f" ]; then cp "$a/$f" "$f"; fi
            done
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Add empty changeset
        if: ${{ inputs.changeset && !inputs.init && steps.stage.outputs.ok == 'true' }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- openwiki)" ]; then
            mkdir -p .changeset
            printf -- '---\n---\n\nUpdate OpenWiki documentation.\n' > .changeset/openwiki-docs.md
          fi

      - name: Guard changed paths
        id: guard
        env:
          ALLOW_CHANGESET: ${{ inputs.changeset }}
          IS_INIT: ${{ inputs.init }}
        run: |
          set -euo pipefail
          bad=""
          # NUL-delimited, renames split into delete + add so both paths are checked.
          while IFS= read -r -d '' f; do
            case "$f" in
              openwiki/*) ;;
              .changeset/openwiki-docs.md) [ "$ALLOW_CHANGESET" = "true" ] || bad="$bad $f" ;;
              AGENTS.md|CLAUDE.md) [ "$IS_INIT" = "true" ] || bad="$bad $f" ;;
              *) bad="$bad $f" ;;
            esac
          done < <(git diff --no-renames --name-only -z HEAD; git ls-files --others --exclude-standard -z)
          if [ -n "$bad" ]; then
            echo "::error::Changes outside the allowed documentation paths:$bad"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan changes for secrets
        id: scan
        run: |
          set -euo pipefail
          # Mark new files intent-to-add so the diff includes them. Only existing paths:
          # git aborts the whole command on a pathspec that matches nothing.
          scan_paths=()
          for p in openwiki AGENTS.md CLAUDE.md .changeset; do
            if [ -e "$p" ]; then scan_paths+=("$p"); fi
          done
          if [ "${#scan_paths[@]}" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -N -- "${scan_paths[@]}"
          # Added lines only. Token-shaped strings and obvious credential assignments.
          patterns='AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{10,}|(api[_-]?key|secret|token|password|passwd)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']?[A-Za-z0-9_+/=-]{20,}'
          hits="$(git diff -U0 HEAD -- "${scan_paths[@]}" | grep -E '^\+' | grep -vE '^\+\+\+' | grep -iE "$patterns" || true)"
          if [ -n "$hits" ]; then
            echo "::error::Possible secret in generated docs. Matching lines are not printed; review the PR diff."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # git add aborts on a pathspec that matches nothing, so list only paths that exist.
      - name: List paths to commit
        id: paths
        run: |
          set -euo pipefail
          {
            echo "list<<PATHS_EOF"
            for p in openwiki AGENTS.md CLAUDE.md .changeset/openwiki-docs.md; do
              if [ -e "$p" ]; then echo "$p"; fi
            done
            echo "PATHS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        id: app
        if: ${{ inputs.use_app }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create OpenWiki pull request
        id: create-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ inputs.use_app && steps.app.outputs.token || github.token }}
          add-paths: ${{ steps.paths.outputs.list }}
          branch: ${{ inputs.init && 'openwiki/init' || 'openwiki/update' }}
          commit-message: "docs: ${{ inputs.init && 'initialize' || 'update' }} OpenWiki [skip ci]"
          title: "docs: ${{ inputs.init && 'initialize' || 'update' }} OpenWiki"
          body: |
            Automated OpenWiki documentation ${{ inputs.init && 'setup' || 'update' }}.

            - OpenWiki result: `${{ needs.generate.outputs.outcome }}`
            - Path guard: `${{ steps.guard.outputs.ok }}`
            - Secret scan: `${{ steps.scan.outputs.ok }}`
            ${{ inputs.init && '- Initial setup: review this PR; it is never merged automatically.' || '- Merged automatically only when the result, guard and scan all pass.' }}

      - name: Merge the update pull request
        if: ${{ !inputs.init && needs.generate.outputs.outcome == 'success' && steps.stage.outputs.ok == 'true' && steps.guard.outputs.ok == 'true' && steps.scan.outputs.ok == 'true' && steps.create-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ inputs.use_app && steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          ALLOW_CHANGESET: ${{ inputs.changeset }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          # Re-check the allowlist on the PR's actual file list right before merging.
          bad=""
          while IFS= read -r f; do
            case "$f" in
              openwiki/*) ;;
              .changeset/openwiki-docs.md) [ "$ALLOW_CHANGESET" = "true" ] || bad="$bad $f" ;;
              *) bad="$bad $f" ;;
            esac
          done < <(gh pr view "$PR_NUMBER" --json files --jq '.files[].path')
          if [ -n "$bad" ]; then
            echo "::error::PR contains paths outside the allowlist, not merging:$bad"
            exit 1
          fi
          subject="docs: update OpenWiki [skip ci]"
          if ! gh pr merge "$PR_NUMBER" --squash --delete-branch --subject "$subject" --body ""; then
            echo "Direct merge refused (branch protection); enabling auto-merge."
            gh pr merge "$PR_NUMBER" --auto --squash --subject "$subject" --body ""
          fi

      - name: Disable auto-merge after a failed run
        if: ${{ !inputs.init && (needs.generate.outputs.outcome != 'success' || steps.stage.outputs.ok == 'false' || steps.guard.outputs.ok == 'false' || steps.scan.outputs.ok == 'false') && steps.create-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ inputs.use_app && steps.app.outputs.token || github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          gh pr merge --disable-auto "$PR_NUMBER" || true

      - name: Annotate pull request
        if: ${{ !cancelled() && steps.create-pr.outputs.pull-request-url != '' }}
        env:
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: echo "::notice title=OpenWiki pull request::$PR_URL"

      - name: Fail when generation, guard or scan failed
        if: ${{ needs.generate.result != 'success' || needs.generate.outputs.outcome == 'failure' || steps.stage.outputs.ok == 'false' || steps.guard.outputs.ok == 'false' || steps.scan.outputs.ok == 'false' }}
        run: exit 1
