name: E2E (Maestro)

# Reusable Maestro e2e for Android, iOS and web (docs/specs/2026-11-22-INF-1908-e2e-maestro).
# The workflow owns the toolchain and the device: it boots an Android emulator,
# an iOS simulator or a headless Chrome, then hands the device to the caller's
# test command as E2E_DEVICE (emulator serial, simulator UDID or web URL) with
# E2E_PLATFORM set to android, ios or web. The caller supplies how to set up,
# build, serve and test its own app.
#
# Android and iOS run on the Mac Studio (INF-1983 D36): each app repo registers
# a `mac-studio-<repo>-android` and a `mac-studio-<repo>-ios` runner, labelled
# mac-studio-android and mac-studio-ios, so the two platforms run side by side.
# iOS needs Xcode and Docker; hosted macOS has no Docker. On macOS the Android
# job boots an arm64 emulator from a per-runner AVD that keeps a quick-boot
# snapshot between runs; on a Linux `android-runner` it keeps the KVM path.
# Fork PRs never reach the Studio.
#
# A new push never cancels a running suite: the run finishes and only the newest
# pending push waits behind it.

on:
  workflow_call:
    inputs:
      platforms:
        description: "Comma-separated platforms to run: android, ios, web"
        type: string
        required: true
      flows-path:
        description: "Maestro flows directory or file, used by the default test command"
        type: string
        default: ".maestro"
      artifact-path:
        description: "Directory with reports, screenshots and logs, uploaded when a job fails"
        type: string
        default: ".e2e"
      install-command:
        description: "Dependency install command"
        type: string
        default: "npm ci"
      setup-command:
        description: "Runs after install, before the build (e.g. start a local backend). E2E_PLATFORM is set"
        type: string
        default: ""
      build-command:
        description: "Builds the app under test. E2E_PLATFORM is set"
        type: string
        default: ""
      test-command:
        description: "Installs the build and runs Maestro. E2E_PLATFORM and E2E_DEVICE are set. Empty runs `maestro test <flows-path>` with a JUnit report in <artifact-path>"
        type: string
        default: ""
      teardown-command:
        description: "Always runs at the end (e.g. stop a local backend). Matters on self-hosted runners, which keep state"
        type: string
        default: ""
      serve-command:
        description: "web only: serves the built app in the background"
        type: string
        default: ""
      web-url:
        description: "web only: URL the served app answers on; passed as E2E_DEVICE"
        type: string
        default: "http://localhost:8080"
      maestro-version:
        type: string
        default: "2.12.1"
      node-version:
        type: string
        default: "22"
      registry-scope:
        description: "npm scope read from GitHub Packages with PKG_READ_TOKEN (e.g. @cheunjm); empty for public registries only"
        type: string
        default: ""
      supabase-cli:
        description: "Install the Supabase CLI (needed for a local Supabase stack)"
        type: boolean
        default: false
      supabase-version:
        description: "Supabase CLI version. Pinned: `latest` makes an unauthenticated GitHub API call that hits rate limits"
        type: string
        default: "3.2.0"
      android-runner:
        description: "mac-studio-android (the Studio), or a hosted Linux label such as ubuntu-latest for the KVM emulator"
        type: string
        default: "mac-studio-android"
      ios-runner:
        type: string
        default: "mac-studio-ios"
      web-runner:
        type: string
        default: "ubuntu-latest"
      android-api-level:
        type: number
        default: 34
      android-arch:
        description: "Emulator ABI. Empty picks the runner's: arm64-v8a on macOS, x86_64 on Linux"
        type: string
        default: ""
      android-profile:
        type: string
        default: "pixel_6"
      ios-runtime:
        description: "Simulator runtime filter, e.g. iOS-17-0. Empty picks the newest iOS runtime"
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 60
      studio-lock:
        description: "On macOS (the Studio), take one of the Studio's slots (INF-1983 D37) before the heavy steps and release it at the end of the job"
        type: boolean
        default: true
      app-artifact:
        description: "Name prefix of a same-run artifact with the app to install: <prefix>-android holds one .apk, <prefix>-ios one tarred .app directory. When set, setup-command and build-command are skipped and the app is installed on the booted device"
        type: string
        default: ""
      include-tags:
        description: "Passed as --include-tags to the default test command (empty test-command only)"
        type: string
        default: ""
      environment:
        description: "GitHub Environment the android and ios jobs run in, for its secret E2E_TEST_ACCOUNTS. Empty sets no environment"
        type: string
        default: ""
    secrets:
      PKG_READ_TOKEN:
        required: false
      E2E_TEST_ACCOUNTS:
        description: 'JSON {"android":{"email":"...","password":"..."},"ios":{...}}: each platform signs in with its own test account, exported as E2E_EMAIL and E2E_PASSWORD'
        required: false

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail, so `build | tee log` fails when
# the build fails (the implicit default is `bash -e` without pipefail).
defaults:
  run:
    shell: bash

env:
  E2E_ARTIFACTS: ${{ inputs.artifact-path }}
  # CI never sends Maestro CLI analytics; collecting them also scans Android
  # emulator state on every start.
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"

jobs:
  android:
    name: android
    # The default runner is self-hosted: only same-repo branches and manual runs
    # reach the Studio.
    if: >-
      contains(inputs.platforms, 'android') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.android-runner }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: e2e-maestro-android-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    # E2E_DEVICE is written to GITHUB_ENV once the device is known: a job-level
    # value would override it.
    env:
      E2E_PLATFORM: android
    steps:
      # First step: wait for a Studio slot before anything heavy (INF-1983 D37).
      - name: Acquire Studio slot
        id: lock
        if: runner.os == 'macOS' && inputs.studio-lock
        uses: cheunjm/.github/.github/actions/studio-lock@v1
        with:
          mode: acquire

      - name: Prepare Linux host
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          echo "E2E_DEVICE=emulator-5554" >> "$GITHUB_ENV"

      # Same host setup as the iOS job (Docker Desktop's CLI alone, an empty
      # DOCKER_CONFIG, Java 17), plus the host's Android SDK. Android state
      # lives in ~/Library/Android/e2e (ANDROID_USER_HOME), never ~/.android:
      # the AVDs there persist so their quick-boot snapshots survive runs.
      - name: Prepare macOS host
        if: runner.os == 'macOS'
        run: |
          shim="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$shim"
          if [ -x /usr/local/bin/docker ]; then ln -sf /usr/local/bin/docker "$shim/docker"; fi
          echo "$shim" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          if [ -S "$HOME/.docker/run/docker.sock" ]; then
            export DOCKER_HOST="unix://$HOME/.docker/run/docker.sock"
            echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          fi
          if ! "$shim/docker" info > /dev/null 2>&1; then
            echo "::warning::Docker is not running on this runner; a local backend in setup-command will fail."
          fi
          sdk="$HOME/Library/Android/sdk"
          if [ ! -x "$sdk/emulator/emulator" ] || [ ! -x "$sdk/cmdline-tools/latest/bin/avdmanager" ]; then
            echo "::error::The runner host needs the Android SDK at $sdk with emulator and cmdline-tools/latest."
            exit 1
          fi
          user_home="$HOME/Library/Android/e2e"
          mkdir -p "$user_home/avd"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "ANDROID_USER_HOME=$user_home"
            echo "ANDROID_AVD_HOME=$user_home/avd"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$sdk/cmdline-tools/latest/bin" "$sdk/emulator" "$sdk/platform-tools" >> "$GITHUB_PATH"

      # The build, a local backend and the emulator outgrow the hosted runner's
      # free disk; drop toolchains this job never uses.
      - name: Free disk space
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /opt/microsoft /opt/google "$AGENT_TOOLSDIRECTORY/Ruby"
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: ${{ inputs.registry-scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.registry-scope }}

      # The Studio already has Java 17 and a warm ~/.gradle.
      - uses: actions/setup-java@v6
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: runner.os == 'Linux'
        with:
          cache-read-only: false

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        if: inputs.supabase-cli
        with:
          version: ${{ inputs.supabase-version }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"

      # Test account for this platform from the Environment secret
      # E2E_TEST_ACCOUNTS; nothing is exported when the secret is empty.
      - name: Export test account
        env:
          ACCOUNTS: ${{ secrets.E2E_TEST_ACCOUNTS }}
        run: |
          [ -n "$ACCOUNTS" ] || exit 0
          creds=$(python3 -I -c '
          import json, os, sys
          try:
              entry = json.loads(os.environ["ACCOUNTS"]).get(os.environ["E2E_PLATFORM"])
          except (ValueError, AttributeError):
              print("::error::E2E_TEST_ACCOUNTS is not a JSON object", file=sys.stderr)
              sys.exit(1)
          if not isinstance(entry, dict) or not entry.get("email") or not entry.get("password"):
              print("::error::E2E_TEST_ACCOUNTS has no " + os.environ["E2E_PLATFORM"] + " entry", file=sys.stderr)
              sys.exit(1)
          email, password = str(entry["email"]), str(entry["password"])
          if "\n" in email or "\n" in password or "\r" in email or "\r" in password:
              print("::error::E2E_TEST_ACCOUNTS values must not contain line breaks", file=sys.stderr)
              sys.exit(1)
          print(email)
          print(password)
          ')
          email=$(printf '%s\n' "$creds" | sed -n 1p)
          password=$(printf '%s\n' "$creds" | sed -n 2p)
          echo "::add-mask::$email"
          echo "::add-mask::$password"
          {
            echo "E2E_EMAIL=$email"
            echo "E2E_PASSWORD=$password"
            echo "MAESTRO_E2E_EMAIL=$email"
            echo "MAESTRO_E2E_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Set up
        if: inputs.setup-command != '' && inputs.app-artifact == ''
        env:
          COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Build
        if: inputs.build-command != '' && inputs.app-artifact == ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          bash -euo pipefail -c "$COMMAND" 2>&1 | tee "$E2E_ARTIFACTS/build-android.log"

      - name: Download app
        if: inputs.app-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app-artifact }}-android
          path: ${{ runner.temp }}/e2e-app

      - name: Pick app
        if: inputs.app-artifact != ''
        env:
          APP_DIR: ${{ runner.temp }}/e2e-app
          ARTIFACT: ${{ inputs.app-artifact }}-android
        run: |
          count=$(find "$APP_DIR" -type f -name '*.apk' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Artifact $ARTIFACT must hold exactly one .apk, found $count"
            exit 1
          fi
          apk=$(find "$APP_DIR" -type f -name '*.apk')
          echo "E2E_APK=$apk" >> "$GITHUB_ENV"

      # Flows read the installed build's id as appId: ${MAESTRO_APP_ID}.
      - name: Read app id
        if: inputs.app-artifact != ''
        run: |
          tool="${ANDROID_HOME:-}/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$tool" ]; then
            tool=$(command -v apkanalyzer || true)
          fi
          app_id=""
          if [ -n "$tool" ]; then
            app_id=$("$tool" manifest application-id "$E2E_APK" || true)
          fi
          if [ -z "$app_id" ]; then
            echo "::error::cannot read the application id of $E2E_APK"
            exit 1
          fi
          echo "App id: $app_id"
          { echo "MAESTRO_APP_ID=$app_id"; echo "E2E_APP_ID=$app_id"; } >> "$GITHUB_ENV"

      - name: Install Maestro
        env:
          MAESTRO_VERSION: ${{ inputs.maestro-version }}
        run: |
          # The installer appends a PATH line to ${ZDOTDIR:-$HOME}/.zshrc whenever
          # maestro is not on PATH. On a self-hosted runner that is the real
          # ~/.zshrc, so point ZDOTDIR at the job's temp dir and put the install
          # dir on PATH first.
          export ZDOTDIR="$RUNNER_TEMP" PATH="$HOME/.maestro/bin:$PATH"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # android-emulator-runner runs each script line on its own, so the test
      # command goes into one file.
      - name: Write test script
        env:
          COMMAND: ${{ inputs.test-command }}
          FLOWS: ${{ inputs.flows-path }}
          TAGS: ${{ inputs.include-tags }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          script="$RUNNER_TEMP/e2e-test.sh"
          if [ -n "$COMMAND" ]; then
            printf 'set -euo pipefail\n%s\n' "$COMMAND" > "$script"
          else
            tagargs=""
            if [ -n "$TAGS" ]; then tagargs=$(printf ' --include-tags %q' "$TAGS"); fi
            # shellcheck disable=SC2016 # $E2E_DEVICE must expand when the script runs
            printf 'set -euo pipefail\nmaestro --device "$E2E_DEVICE" test "%s"%s --format junit --output "%s/report.xml" --debug-output "%s/maestro"\n' \
              "$FLOWS" "$tagargs" "$E2E_ARTIFACTS" "$E2E_ARTIFACTS" > "$script"
          fi
          echo "E2E_TEST_SCRIPT=$script" >> "$GITHUB_ENV"

      - name: Cache AVD
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.android-api-level }}-${{ inputs.android-arch || 'x86_64' }}-${{ inputs.android-profile }}-4c4g

      - name: Create AVD snapshot
        if: runner.os == 'Linux' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ inputs.android-api-level }}
          arch: ${{ inputs.android-arch || 'x86_64' }}
          profile: ${{ inputs.android-profile }}
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro suite
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ inputs.android-api-level }}
          arch: ${{ inputs.android-arch || 'x86_64' }}
          profile: ${{ inputs.android-profile }}
          cores: 4
          ram-size: 4096M
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # System apps (Search, the launcher) can ANR on a busy cold emulator, and
          # their dialogs cover the app under test: hide error dialogs, drop Search.
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell pm disable-user --user 0 com.android.quicksearchbox || true
            [ -z "${E2E_APK:-}" ] || adb install -r "$E2E_APK"
            bash "$E2E_TEST_SCRIPT"

      # macOS: one AVD per runner, and a runner runs one job at a time, so no
      # other job touches it. The first run creates it, cold-boots it, saves a
      # quick-boot snapshot and shuts it down; later runs boot from that
      # snapshot and never save over it. When the emulator rejects the snapshot
      # (a new emulator or system image), this run cold-boots and the AVD is
      # rebuilt next time. Each job picks a free port, so repos share the host.
      - name: Boot emulator
        if: runner.os == 'macOS'
        env:
          API: ${{ inputs.android-api-level }}
          ARCH: ${{ inputs.android-arch || 'arm64-v8a' }}
          PROFILE: ${{ inputs.android-profile }}
        run: |
          image="system-images;android-$API;google_apis;$ARCH"
          if [ ! -d "$ANDROID_HOME/system-images/android-$API/google_apis/$ARCH" ]; then
            yes | sdkmanager "$image" > /dev/null
          fi
          name="e2e-$RUNNER_NAME-$API-$ARCH-$PROFILE"
          avd="$ANDROID_AVD_HOME/$name.avd"
          log="$RUNNER_TEMP/emulator.log"
          echo "E2E_AVD=$name" >> "$GITHUB_ENV"

          # An emulator left by a run the runner killed holds the AVD's locks.
          pkill -f -- "-avd $name -port" || true
          rm -f "$avd"/*.lock

          # Every job on the host shares one adb server. Start it outside this
          # job's process tracking, or the runner kills it when the job ends
          # while another job still needs it.
          RUNNER_TRACKING_ID="" adb start-server

          port=""
          for p in $(seq 5554 2 5584); do
            if ! nc -z 127.0.0.1 "$p" 2> /dev/null && ! nc -z 127.0.0.1 $((p + 1)) 2> /dev/null; then
              port=$p
              break
            fi
          done
          if [ -z "$port" ]; then echo "::error::No free emulator port in 5554-5584"; exit 1; fi
          serial="emulator-$port"

          # boot <timeout in seconds> <emulator flags...>
          boot() {
            local limit=$1 start=$SECONDS
            shift
            emulator -avd "$name" -port "$port" -no-window -no-audio -no-boot-anim \
              -gpu swiftshader_indirect -camera-back none -camera-front none -accel on "$@" > "$log" 2>&1 &
            pid=$!
            echo "E2E_EMULATOR_PID=$pid" >> "$GITHUB_ENV"
            until [ "$(adb -s "$serial" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = "1" ]; do
              if ! kill -0 "$pid" 2> /dev/null; then
                echo "::error::The emulator exited during boot"
                tail -40 "$log"
                exit 1
              fi
              if [ $((SECONDS - start)) -gt "$limit" ]; then
                echo "::error::The emulator did not boot in ${limit}s"
                tail -40 "$log"
                exit 1
              fi
              sleep 3
            done
            echo "Booted $name as $serial in $((SECONDS - start))s"
          }

          if [ ! -f "$avd/snapshots/default_boot/snapshot.pb" ]; then
            echo "No quick-boot snapshot for $name: creating the AVD and saving one."
            rm -rf "$avd" "$ANDROID_AVD_HOME/$name.ini"
            echo no | avdmanager create avd -n "$name" -k "$image" -d "$PROFILE" --force > /dev/null
            printf 'hw.cpu.ncore=4\nhw.ramSize=4096\ndisk.dataPartition.size=6G\n' >> "$avd/config.ini"
            boot 900 -no-snapshot-load
            # Let first-boot work settle so the snapshot holds an idle device.
            sleep 30
            adb -s "$serial" emu kill > /dev/null
            for _ in $(seq 1 90); do
              kill -0 "$pid" 2> /dev/null || break
              sleep 2
            done
            if [ ! -f "$avd/snapshots/default_boot/snapshot.pb" ]; then
              echo "::warning::The emulator saved no quick-boot snapshot; this run cold-boots."
            fi
          fi

          boot 600 -no-snapshot-save
          if ! grep -qi "loaded snapshot" "$log"; then
            echo "::warning::The emulator cold-booted instead of loading its snapshot; the next run rebuilds $name."
            echo "E2E_AVD_STALE=1" >> "$GITHUB_ENV"
          fi

          # System apps (Search, the launcher) can ANR on a busy emulator, and
          # their dialogs cover the app under test: hide error dialogs, drop Search.
          for setting in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb -s "$serial" shell settings put global "$setting" 0
          done
          adb -s "$serial" shell settings put global hide_error_dialogs 1
          adb -s "$serial" shell pm disable-user --user 0 com.android.quicksearchbox > /dev/null 2>&1 || true
          # ANDROID_SERIAL points a bare `adb` at this emulator when another
          # job's emulator is also running.
          { echo "E2E_DEVICE=$serial"; echo "ANDROID_SERIAL=$serial"; } >> "$GITHUB_ENV"

      # On Linux the install runs inside the emulator script above.
      - name: Install app
        if: runner.os == 'macOS' && inputs.app-artifact != ''
        run: adb -s "$E2E_DEVICE" install -r "$E2E_APK"

      # Maestro reads ~/.android from the JVM's user.home; point it at the
      # job's Android state, not the host's ~/.android.
      - name: Run Maestro suite
        if: runner.os == 'macOS'
        run: |
          maestro_home="$RUNNER_TEMP/maestro-home"
          mkdir -p "$maestro_home"
          ln -sfn "$ANDROID_USER_HOME" "$maestro_home/.android"
          export JAVA_TOOL_OPTIONS="-Duser.home=$maestro_home${JAVA_TOOL_OPTIONS:+ $JAVA_TOOL_OPTIONS}"
          bash "$E2E_TEST_SCRIPT"

      - name: Tear down
        if: always() && inputs.teardown-command != ''
        env:
          COMMAND: ${{ inputs.teardown-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Stop emulator
        if: always() && runner.os == 'macOS' && env.E2E_AVD != ''
        run: |
          if [ -n "${E2E_DEVICE:-}" ]; then adb -s "$E2E_DEVICE" emu kill > /dev/null 2>&1 || true; fi
          if [ -n "${E2E_EMULATOR_PID:-}" ]; then
            for _ in $(seq 1 15); do
              kill -0 "$E2E_EMULATOR_PID" 2> /dev/null || break
              sleep 2
            done
            kill -9 "$E2E_EMULATOR_PID" 2> /dev/null || true
          fi
          if [ "${E2E_AVD_STALE:-}" = "1" ]; then
            rm -rf "$ANDROID_AVD_HOME/$E2E_AVD.avd" "$ANDROID_AVD_HOME/$E2E_AVD.ini"
            echo "Removed $E2E_AVD; the next run rebuilds it and its snapshot."
          fi

      - name: Release Studio slot
        if: always() && steps.lock.outputs.slot != ''
        uses: cheunjm/.github/.github/actions/studio-lock@v1
        with:
          mode: release
          slot: ${{ steps.lock.outputs.slot }}

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-android
          # Reports, screenshots and logs only: skip build outputs (APKs, app
          # bundles, Xcode derived data) that callers may keep in the same dir.
          path: |
            ${{ inputs.artifact-path }}
            !${{ inputs.artifact-path }}/**/*.apk
            !${{ inputs.artifact-path }}/**/*.app/**
            !${{ inputs.artifact-path }}/**/Build/**
            !${{ inputs.artifact-path }}/**/Index.noindex/**
            !${{ inputs.artifact-path }}/**/ModuleCache.noindex/**
            !${{ inputs.artifact-path }}/**/SDKStatCaches.noindex/**
          if-no-files-found: ignore
          include-hidden-files: true

  ios:
    name: ios
    # Self-hosted: only same-repo branches and manual runs reach the Studio.
    if: >-
      contains(inputs.platforms, 'ios') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.ios-runner }}
    environment: ${{ inputs.environment != '' && inputs.environment || null }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: e2e-maestro-ios-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      E2E_PLATFORM: ios
      # Maestro's iOS driver can be slow to start on a busy machine.
      MAESTRO_DRIVER_STARTUP_TIMEOUT: "600000"
    steps:
      # First step: wait for a Studio slot before anything heavy (INF-1983 D37).
      - name: Acquire Studio slot
        id: lock
        if: runner.os == 'macOS' && inputs.studio-lock
        uses: cheunjm/.github/.github/actions/studio-lock@v1
        with:
          mode: acquire

      # The Studio runner service's PATH has no /usr/local/bin (Docker Desktop's
      # CLI) and no Java selected; Maestro needs Java 17.
      # The runner service's PATH lacks Docker Desktop's CLI (/usr/local/bin).
      # Expose only `docker` through a job-local dir: /usr/local/bin also holds
      # stale tools (a 2021 CocoaPods) that would shadow Homebrew's.
      # Docker Desktop's own config sends pulls through the keychain credential
      # helper and Scout hooks, which hang in a runner service with no GUI
      # session. The images e2e needs are public, so use an empty config and
      # talk to Docker Desktop's socket directly.
      - name: Prepare macOS host
        run: |
          shim="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$shim"
          if [ -x /usr/local/bin/docker ]; then ln -sf /usr/local/bin/docker "$shim/docker"; fi
          echo "$shim" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"
          # Maestro lists <ANDROID_USER_HOME>/avd at startup even for iOS. Point
          # it at an empty dir so the job never reads the host's ~/.android
          # (which may live on a volume a background runner cannot read).
          android_user_home="$RUNNER_TEMP/android-user-home"
          mkdir -p "$android_user_home/avd"
          echo "ANDROID_USER_HOME=$android_user_home" >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-config"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          if [ -S "$HOME/.docker/run/docker.sock" ]; then
            export DOCKER_HOST="unix://$HOME/.docker/run/docker.sock"
            echo "DOCKER_HOST=$DOCKER_HOST" >> "$GITHUB_ENV"
          fi
          if ! "$shim/docker" info > /dev/null 2>&1; then
            echo "::warning::Docker is not running on this runner; a local backend in setup-command will fail."
          fi
          xcodebuild -version

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: ${{ inputs.registry-scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.registry-scope }}

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        if: inputs.supabase-cli
        with:
          version: ${{ inputs.supabase-version }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"

      # Test account for this platform from the Environment secret
      # E2E_TEST_ACCOUNTS; nothing is exported when the secret is empty.
      - name: Export test account
        env:
          ACCOUNTS: ${{ secrets.E2E_TEST_ACCOUNTS }}
        run: |
          [ -n "$ACCOUNTS" ] || exit 0
          creds=$(python3 -I -c '
          import json, os, sys
          try:
              entry = json.loads(os.environ["ACCOUNTS"]).get(os.environ["E2E_PLATFORM"])
          except (ValueError, AttributeError):
              print("::error::E2E_TEST_ACCOUNTS is not a JSON object", file=sys.stderr)
              sys.exit(1)
          if not isinstance(entry, dict) or not entry.get("email") or not entry.get("password"):
              print("::error::E2E_TEST_ACCOUNTS has no " + os.environ["E2E_PLATFORM"] + " entry", file=sys.stderr)
              sys.exit(1)
          email, password = str(entry["email"]), str(entry["password"])
          if "\n" in email or "\n" in password or "\r" in email or "\r" in password:
              print("::error::E2E_TEST_ACCOUNTS values must not contain line breaks", file=sys.stderr)
              sys.exit(1)
          print(email)
          print(password)
          ')
          email=$(printf '%s\n' "$creds" | sed -n 1p)
          password=$(printf '%s\n' "$creds" | sed -n 2p)
          echo "::add-mask::$email"
          echo "::add-mask::$password"
          {
            echo "E2E_EMAIL=$email"
            echo "E2E_PASSWORD=$password"
            echo "MAESTRO_E2E_EMAIL=$email"
            echo "MAESTRO_E2E_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Set up
        if: inputs.setup-command != '' && inputs.app-artifact == ''
        env:
          COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Build
        if: inputs.build-command != '' && inputs.app-artifact == ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          bash -euo pipefail -c "$COMMAND" 2>&1 | tee "$E2E_ARTIFACTS/build-ios.log"

      - name: Download app
        if: inputs.app-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.app-artifact }}-ios
          path: ${{ runner.temp }}/e2e-app

      - name: Pick app
        if: inputs.app-artifact != ''
        env:
          APP_DIR: ${{ runner.temp }}/e2e-app
          ARTIFACT: ${{ inputs.app-artifact }}-ios
        run: |
          count=$(find "$APP_DIR" -type f \( -name '*.tar.gz' -o -name '*.tar' \) | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Artifact $ARTIFACT must hold exactly one .tar.gz or .tar, found $count"
            exit 1
          fi
          archive=$(find "$APP_DIR" -type f \( -name '*.tar.gz' -o -name '*.tar' \))
          extract="$RUNNER_TEMP/e2e-ios-app"
          rm -rf "$extract"
          mkdir -p "$extract"
          tar -xf "$archive" -C "$extract"
          count=$(find "$extract" -maxdepth 2 -type d -name '*.app' | wc -l | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "::error::Artifact $ARTIFACT must hold exactly one .app, found $count"
            exit 1
          fi
          app=$(find "$extract" -maxdepth 2 -type d -name '*.app')
          echo "E2E_APP=$app" >> "$GITHUB_ENV"

      # Flows read the installed build's id as appId: ${MAESTRO_APP_ID}.
      - name: Read app id
        if: inputs.app-artifact != ''
        run: |
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$E2E_APP/Info.plist" || true)
          if [ -z "$app_id" ]; then
            echo "::error::cannot read the application id of $E2E_APP"
            exit 1
          fi
          echo "App id: $app_id"
          { echo "MAESTRO_APP_ID=$app_id"; echo "E2E_APP_ID=$app_id"; } >> "$GITHUB_ENV"

      - name: Install Maestro
        env:
          MAESTRO_VERSION: ${{ inputs.maestro-version }}
        run: |
          # The installer appends a PATH line to ${ZDOTDIR:-$HOME}/.zshrc whenever
          # maestro is not on PATH. On a self-hosted runner that is the real
          # ~/.zshrc, so point ZDOTDIR at the job's temp dir and put the install
          # dir on PATH first.
          export ZDOTDIR="$RUNNER_TEMP" PATH="$HOME/.maestro/bin:$PATH"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # A throwaway simulator on the newest iOS runtime (or the one matching
      # ios-runtime) and the newest plain iPhone that runtime supports. It is
      # created from the runtime's device types, so the host needs no existing
      # simulators, and deleted in the last step.
      - name: Boot simulator
        env:
          RUNTIME_FILTER: ${{ inputs.ios-runtime }}
        run: |
          # shellcheck disable=SC2016 # the node program is single-quoted on purpose
          read -r device_type runtime < <(xcrun simctl list runtimes available -j | node -e '
            const { runtimes } = JSON.parse(require("fs").readFileSync(0));
            const filter = process.env.RUNTIME_FILTER || ".iOS-";
            const semver = (v) => v.split(".").map(Number);
            const cmp = (a, b) => { const x = semver(a), y = semver(b);
              for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] ?? 0) - (y[i] ?? 0); if (d) return d; }
              return 0; };
            const runtime = runtimes
              .filter((r) => r.platform === "iOS" && r.identifier.includes(filter))
              .sort((a, b) => cmp(a.version, b.version))
              .at(-1);
            if (!runtime) { console.error(`no available iOS runtime matches "${filter}"`); process.exit(1); }
            const iphones = (runtime.supportedDeviceTypes ?? [])
              .map((d) => ({ d, n: Number((d.name.match(/^iPhone (\d+)/) ?? [])[1]) }))
              .filter(({ n }) => n > 0)
              .sort((a, b) => a.n - b.n || b.d.name.length - a.d.name.length);
            if (!iphones.length) { console.error(`runtime ${runtime.identifier} supports no iPhone`); process.exit(1); }
            console.log(iphones.at(-1).d.identifier, runtime.identifier)')
          udid=$(xcrun simctl create "E2E ${GITHUB_REPOSITORY#*/} ${GITHUB_RUN_ID}" "$device_type" "$runtime")
          echo "E2E_DEVICE=$udid" >> "$GITHUB_ENV"
          echo "Booting $device_type on $runtime as $udid"
          xcrun simctl bootstatus "$udid" -b

      # Maestro's Android client also reads ~/.android/adbkey from the JVM's
      # user.home (ignoring ANDROID_USER_HOME) even on iOS. Give the JVM a
      # job-local home so an iOS run never touches the host's Android state.
      - name: Install app
        if: inputs.app-artifact != ''
        run: xcrun simctl install "$E2E_DEVICE" "$E2E_APP"

      - name: Run Maestro suite
        env:
          COMMAND: ${{ inputs.test-command }}
          FLOWS: ${{ inputs.flows-path }}
          TAGS: ${{ inputs.include-tags }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          maestro_home="$RUNNER_TEMP/maestro-home"
          mkdir -p "$maestro_home/.android"
          export JAVA_TOOL_OPTIONS="-Duser.home=$maestro_home${JAVA_TOOL_OPTIONS:+ $JAVA_TOOL_OPTIONS}"
          if [ -n "$COMMAND" ]; then
            bash -euo pipefail -c "$COMMAND"
          else
            tags=()
            if [ -n "$TAGS" ]; then tags=(--include-tags "$TAGS"); fi
            maestro --device "$E2E_DEVICE" test "$FLOWS" ${tags[@]+"${tags[@]}"} --format junit \
              --output "$E2E_ARTIFACTS/report.xml" --debug-output "$E2E_ARTIFACTS/maestro"
          fi

      - name: Tear down
        if: always() && inputs.teardown-command != ''
        env:
          COMMAND: ${{ inputs.teardown-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Delete simulator
        if: always() && env.E2E_DEVICE != ''
        run: |
          xcrun simctl shutdown "$E2E_DEVICE" > /dev/null 2>&1 || true
          xcrun simctl delete "$E2E_DEVICE"

      - name: Release Studio slot
        if: always() && steps.lock.outputs.slot != ''
        uses: cheunjm/.github/.github/actions/studio-lock@v1
        with:
          mode: release
          slot: ${{ steps.lock.outputs.slot }}

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-ios
          path: |
            ${{ inputs.artifact-path }}
            !${{ inputs.artifact-path }}/**/*.apk
            !${{ inputs.artifact-path }}/**/*.app/**
            !${{ inputs.artifact-path }}/**/Build/**
            !${{ inputs.artifact-path }}/**/Index.noindex/**
            !${{ inputs.artifact-path }}/**/ModuleCache.noindex/**
            !${{ inputs.artifact-path }}/**/SDKStatCaches.noindex/**
          if-no-files-found: ignore
          include-hidden-files: true

  web:
    name: web
    if: contains(inputs.platforms, 'web')
    runs-on: ${{ inputs.web-runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    concurrency:
      group: e2e-maestro-web-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      E2E_PLATFORM: web
      E2E_DEVICE: ${{ inputs.web-url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: ${{ inputs.registry-scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.registry-scope }}

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        if: inputs.supabase-cli
        with:
          version: ${{ inputs.supabase-version }}

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PKG_READ_TOKEN }}
          COMMAND: ${{ inputs.install-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Set up
        if: inputs.setup-command != ''
        env:
          COMMAND: ${{ inputs.setup-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Build
        if: inputs.build-command != ''
        env:
          COMMAND: ${{ inputs.build-command }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          bash -euo pipefail -c "$COMMAND" 2>&1 | tee "$E2E_ARTIFACTS/build-web.log"

      - name: Install Maestro
        env:
          MAESTRO_VERSION: ${{ inputs.maestro-version }}
        run: |
          # The installer appends a PATH line to ${ZDOTDIR:-$HOME}/.zshrc whenever
          # maestro is not on PATH. On a self-hosted runner that is the real
          # ~/.zshrc, so point ZDOTDIR at the job's temp dir and put the install
          # dir on PATH first.
          export ZDOTDIR="$RUNNER_TEMP" PATH="$HOME/.maestro/bin:$PATH"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Maestro's web driver starts Chrome itself; on a runner it must be headless
      # and unsandboxed. Its ChromeDriver launches /opt/google/chrome/chrome
      # directly, so a wrapper on /usr/bin/google-chrome is never used and Chrome
      # exits at startup ("session not created"). Wrap the real binary instead.
      - name: Wrap Chrome for headless CI
        if: runner.os == 'Linux'
        run: |
          chrome=/opt/google/chrome/chrome
          sudo mv "$chrome" "$chrome.original"
          printf '#!/bin/sh\nexec %s.original "$@" --no-sandbox --headless=new --disable-dev-shm-usage --disable-gpu\n' "$chrome" | sudo tee "$chrome"
          sudo chmod +x "$chrome"

      - name: Serve app
        if: inputs.serve-command != ''
        env:
          COMMAND: ${{ inputs.serve-command }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          nohup bash -c "$COMMAND" > "$E2E_ARTIFACTS/serve.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$E2E_DEVICE"; then echo "Serving at $E2E_DEVICE"; exit 0; fi
            sleep 2
          done
          echo "::error::Nothing answered at $E2E_DEVICE after 120s"
          exit 1

      - name: Run Maestro suite
        env:
          COMMAND: ${{ inputs.test-command }}
          FLOWS: ${{ inputs.flows-path }}
          TAGS: ${{ inputs.include-tags }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          if [ -n "$COMMAND" ]; then
            bash -euo pipefail -c "$COMMAND"
          else
            tags=()
            if [ -n "$TAGS" ]; then tags=(--include-tags "$TAGS"); fi
            maestro test --platform web "$FLOWS" ${tags[@]+"${tags[@]}"} --format junit \
              --output "$E2E_ARTIFACTS/report.xml" --debug-output "$E2E_ARTIFACTS/maestro"
          fi

      - name: Tear down
        if: always() && inputs.teardown-command != ''
        env:
          COMMAND: ${{ inputs.teardown-command }}
        run: bash -euo pipefail -c "$COMMAND"

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web
          path: |
            ${{ inputs.artifact-path }}
            !${{ inputs.artifact-path }}/**/*.apk
            !${{ inputs.artifact-path }}/**/*.app/**
            !${{ inputs.artifact-path }}/**/Build/**
            !${{ inputs.artifact-path }}/**/Index.noindex/**
            !${{ inputs.artifact-path }}/**/ModuleCache.noindex/**
            !${{ inputs.artifact-path }}/**/SDKStatCaches.noindex/**
          if-no-files-found: ignore
          include-hidden-files: true
