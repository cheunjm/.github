name: Labels

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label (e.g., mac-studio for the self-hosted runner)'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  decision-log:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    if: >
      startsWith(github.event.pull_request.head.ref, 'feat/') ||
      startsWith(github.event.pull_request.head.ref, 'fix/')
    permissions:
      pull-requests: write
    steps:
      - name: Add decision-log label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The REST labels endpoint avoids `gh pr edit`, which fails with a
          # Projects (classic) GraphQL deprecation error.
          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" \
            -f "labels[]=decision-log"
