name: Notify on Merge

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        required: true
    inputs:
      slack_channel:
        description: 'Slack channel ID to post merge notification'
        required: true
        type: string
      repo_label:
        description: 'Unused since INF-1822 (the post names the repo itself); kept so callers do not break'
        required: false
        type: string
      runner:
        description: 'Runner label (e.g., mac-studio for the self-hosted runner)'
        required: false
        type: string
        default: 'ubuntu-latest'

jobs:
  notify:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          REPOSITORY: ${{ github.repository }}
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Commit subject and author are attacker-controlled. They are only ever
          # read here as data, never interpolated into the script by Actions.
          # Escape Slack control characters so they cannot trigger mentions/links.
          esc() { sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }

          # The shared Slack post layout (agents/scripts/slack_format.py in
          # cheunjm/dotfiles, standard in cheunjm/conventions
          # architecture/slack-message-format.md): "<icon> [<topic>]", the outcome,
          # bullets, a link. Written by hand because this runs on GitHub and cannot
          # import that script. The topic is the repo name.
          topic=$(printf '%s' "${REPOSITORY#*/}" | tr 'A-Z' 'a-z' | esc)

          # A GitHub merge commit's own subject is only "Merge pull request #N from ...";
          # the PR title is the first line of its body.
          subject=$(git log -1 --pretty=format:'%s')
          if [[ "$subject" == "Merge pull request #"* ]]; then
            title=$(git log -1 --pretty=format:'%b' | sed -n '1p')
            number=${subject#Merge pull request #}
            number=${number%% *}
            if [ -n "$title" ]; then subject="$title (#$number)"; fi
          fi
          # Cap at 200 characters, keeping a trailing " (#N)" (it finds the PR).
          if [ "${#subject}" -gt 200 ]; then
            suffix=""
            if [[ "$subject" =~ (\ \(#[0-9]+\))$ ]]; then
              suffix="${BASH_REMATCH[1]}"
              subject="${subject%"$suffix"}"
            fi
            subject="${subject:0:$((199 - ${#suffix}))}…${suffix}"
          fi

          message=$(printf '%s' "$subject" | esc)
          author=$(git log -1 --pretty=format:'%an' | esc)
          short_sha=$(git log -1 --pretty=format:'%h')

          text=$(printf '✅ [%s]\nmerged %s — %s\n• author: %s\n→ <https://github.com/%s/commit/%s|%s>' \
            "$topic" "$short_sha" "$message" "$author" "$REPOSITORY" "$FULL_SHA" "$short_sha")

          payload=$(jq -n --arg channel "$SLACK_CHANNEL" --arg text "$text" \
            '{channel: $channel, text: $text}')

          response=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload")

          if ! printf '%s' "$response" | jq -e '.ok == true' > /dev/null; then
            echo "::error::Slack API rejected the message: $(printf '%s' "$response" | jq -r '.error // "unknown"')"
            exit 1
          fi
