name: Auto-update PR branches

on:
  workflow_call:
    secrets:
      BOT_APP_ID:
        required: true
      BOT_PRIVATE_KEY:
        required: true

permissions:
  pull-requests: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Update open PR branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Merge, never rebase: a rebase rewrites every commit SHA and
          # force-pushes the PR branch, which diverges local checkouts, drops
          # signatures and desyncs stacked PRs.
          # Only non-draft PRs from this repo that target the default branch;
          # stack layers (base is another branch) and fork PRs are left alone.
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base "$default_branch" \
            --json number,isDraft,isCrossRepository \
            --jq '.[] | select((.isDraft | not) and (.isCrossRepository | not)) | .number')
          failed=0
          for pr in $prs; do
            echo "Updating PR #$pr..."
            if out=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$pr/update-branch" \
              -f update_method="merge" 2>&1); then
              echo "  updated"
            elif echo "$out" | grep -q 'HTTP 422'; then
              echo "  no update needed or merge conflict (HTTP 422)"
            else
              echo "::warning::PR #$pr update failed: $out"
              failed=1
            fi
          done
          exit "$failed"
